<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>H · Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H">
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap');
* {box-sizing:border-box;margin:0;padding:0;}
@import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;--bg4:#323230;--bg5:#3a3a38;
  --fg:#f0ede6;--fg2:#9b9b97;--fg3:#6b6b68;
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --green:#639922;--gdk:#3B6D11;--blue:#378ADD;--amber:#BA7517;--red:#E24B4A;
  --r:6px;--rm:10px;--rl:13px;
  --desktop-grid-gap:11px;
  --desktop-main-card-h:430px;
  --desktop-heatmap-h:200px;
  --desktop-timer-notes-h:calc(var(--desktop-main-card-h) - var(--desktop-heatmap-h) - var(--desktop-grid-gap));
  --desktop-notes-quick-inp-h:72px;
  --desktop-hmap-cell:10px;
  --desktop-hmap-gap:2px;
  --desktop-hmap-dow-width:16px;
  --desktop-timer-header-settings-space:0px;
  --desktop-timer-header-right-offset:0px;
  --desktop-timer-controls-padding:34px;
  --hmap-cell:12px;--hmap-gap:2px;--hmap-dow-width:18px;
}
html,body{
  min-width:0;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;user-select:none;}
/* ── TOP BAR ── */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:11px 16px;border-bottom:.5px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:50;gap:8px;}
.topbar-title{grid-column:2;justify-self:center;font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;}
.topbar-account-wrap{grid-column:3;justify-self:end;position:relative;}
.account-menu-btn{background:none;border:.5px solid var(--b2);border-radius:999px;color:var(--fg2);font-size:11px;padding:5px 10px;cursor:pointer;line-height:1;white-space:nowrap;}
.account-menu-btn:hover{color:var(--fg);}
.account-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:var(--bg2);border:.5px solid var(--b2);border-radius:10px;padding:8px;z-index:120;box-shadow:0 10px 26px rgba(0,0,0,.35);flex-direction:column;gap:6px;}
.account-menu.open{display:flex;}
.account-action,.account-import-btn{background:var(--bg3);border:.5px solid var(--b2);border-radius:7px;color:var(--fg2);font-size:11px;padding:6px 8px;cursor:pointer;text-align:left;}
.account-action:hover,.account-import-btn:hover{color:var(--fg);border-color:var(--blue);}
.account-import-btn{background:rgba(55,138,221,.1);color:#dbeafd;}
.account-status{font-size:11px;color:var(--fg3);padding:2px 1px;}
.account-divider{height:1px;background:var(--b);margin:2px 0;display:none;}
.mobile-account-action{display:none;}
/* ── WRAP ── */
.wrap{max-width:920px;margin:0 auto;padding:10px 12px 60px;}
.save-row{display:flex;align-items:center;gap:8px;padding:6px 0 10px;flex-wrap:wrap;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--fg3);flex-shrink:0;transition:background .4s;cursor:pointer;}
.save-dot.ok{background:var(--green);}.save-dot.err{background:var(--red);}.save-dot.syncing{background:var(--blue);}
.save-txt{font-size:11px;color:var(--fg3);flex:1;opacity:1;transition:opacity .35s ease;}
.save-txt.fade-out{opacity:0;}
.sm-btn{font-size:11px;color:var(--fg3);background:none;border:.5px solid var(--b2);border-radius:4px;padding:3px 8px;cursor:pointer;}
.sm-btn:hover{color:var(--fg2);}
/* ── BENTO GRID ── */
.bento-grid{display:grid;grid-template-columns:1.25fr 1.25fr .75fr .75fr;gap:var(--desktop-grid-gap);align-items:start;}
@media(max-width:700px){.bento-grid{grid-template-columns:repeat(2,1fr);}}
.bento-card{background:var(--bg2);border:.5px solid var(--b);border-radius:var(--rl);padding:13px;position:relative;min-width:0;}
.bento-card[data-span="2"]{grid-column:span 2;}
#card-heatmap{max-width:none;}
#card-heatmap .card-hdr{margin-bottom:8px;}
/* ── DESKTOP LAYOUT (sketch) ── */
#card-todo{grid-column:1;grid-row:1 / span 2;align-self:stretch;height:var(--desktop-main-card-h);display:flex;flex-direction:column;}
#card-routine{grid-column:2;grid-row:1 / span 2;align-self:stretch;height:var(--desktop-main-card-h);display:flex;flex-direction:column;}
#card-routine #task-view{display:flex;flex-direction:column;min-height:0;flex:1;}
#card-routine .routine-scroll{flex:1;min-height:0;max-height:none;}
#card-heatmap{grid-column:3 / span 2;grid-row:1;min-height:0;height:100%;}
#timer-slot{grid-column:3 / span 2;grid-row:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);gap:var(--desktop-grid-gap);min-height:0;align-self:stretch;}
#timer-slot .timer-between-quote{grid-column:1 / -1;}
#card-timer{grid-column:1;grid-row:2;margin-top:0;height:100%;overflow:hidden;}
#card-pages{grid-column:2;grid-row:2;min-height:0;height:100%;align-self:stretch;display:flex;flex-direction:column;}
#card-todo .todo-scroll{flex:1;min-height:0;}
#card-pages .notes-quick-row{align-items:stretch;}
#card-pages .notes-quick-inp{height:var(--desktop-notes-quick-inp-h);overflow-y:hidden;}
#card-pages .notes-preview-row{grid-template-columns:1fr;min-height:0;overflow:hidden;}
.routine-modal-backdrop{display:none;}
@media(min-width:701px){
  :root{--hmap-cell:var(--desktop-hmap-cell);--hmap-gap:var(--desktop-hmap-gap);--hmap-dow-width:var(--desktop-hmap-dow-width);}
  .bento-grid{grid-template-rows:var(--desktop-heatmap-h) var(--desktop-timer-notes-h) auto;}
  #card-timer .card-hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;position:relative;padding-right:0;}
  #card-timer .card-title{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  #card-timer .timer-hdr-right{position:static;transform:none;justify-self:end;flex-shrink:0;}
  #card-timer .timer-inner{align-items:center;}
  #card-timer .tw-header-row,#card-timer .timer-plan,#card-timer .timer-main-row{width:100%;}
  #card-timer .timer-main-row{justify-content:center;width:100%;}
  #card-timer .timer-left{position:relative;align-items:center;text-align:center;width:auto;max-width:100%;margin:0 auto;padding-bottom:0;}
  #card-timer .timer-disp-wrap{display:block;margin:0 auto;text-align:center;}
  #card-timer .timer-ctrl-row{position:static;left:auto;bottom:auto;transform:none;justify-content:center;flex-wrap:nowrap;max-width:100%;}
  #card-timer .timer-phase-row{justify-content:center;}
  #card-timer .timer-plan{width:100%;height:14px;min-height:14px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .routine-modal-backdrop{position:fixed;inset:0;background:rgba(20,20,18,.45);backdrop-filter:blur(7px);display:none;z-index:240;}
  body.routine-edit-modal-open .routine-modal-backdrop{display:block;}
  body.routine-edit-modal-open #card-routine{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,94vw);height:min(86vh,760px);z-index:250;box-shadow:0 24px 70px rgba(0,0,0,.45);}
  body.routine-edit-modal-open #card-routine.routine-editing .editor-wrap.open{display:flex;flex-direction:column;flex:1;min-height:0;position:static;background:none;border:none;border-radius:0;padding:0;box-shadow:none;}
  body.routine-edit-modal-open #card-routine.routine-editing #editor-body{flex:1;min-height:0;overflow-y:auto;padding-right:2px;}
  .goal-bento-card{height:118px;}
}
/* ── CARD HEADER ── */
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px;}
.card-title{font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;}
.card-sub{font-size:11px;color:var(--fg3);}

/* ── TO-DO ── */
.todo-add{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-width:0;}
.todo-inp{flex:1;min-width:0;background:var(--bg3);border:.5px solid var(--b2);border-radius:var(--r);color:var(--fg);font-size:13px;font-family:inherit;padding:7px 10px;outline:none;user-select:text;}
.todo-inp:focus{border-color:var(--blue);}
.todo-inp::placeholder{color:var(--fg3);}
.todo-add-btn{background:var(--green);color:#EAF3DE;border:none;border-radius:var(--r);width:32px;height:32px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.todo-add-btn:hover{background:var(--gdk);}
.todo-scroll{max-height:290px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
.td-item{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:.5px solid var(--b);position:relative;transition:opacity .1s;overflow:hidden;}
.td-item:last-child{border:none;}
.td-item.swiping-r{background:rgba(99,153,34,.07);border-radius:5px;}
.td-item.swiping-l{background:rgba(226,75,74,.05);border-radius:5px;}
.td-indent-wrap{display:flex;flex-shrink:0;padding-left:5px;}
.td-indent-bar{width:13px;height:18px;border-left:1.5px solid var(--b2);margin-right:3px;}
.td-cb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;transition:background .15s;margin-top:1px;}
.td-cb.ck{background:var(--green);border-color:var(--green);color:#EAF3DE;}
.td-text{flex:1;font-size:13px;color:var(--fg);line-height:1.4;word-break:break-word;cursor:pointer;user-select:text;margin-left:8px;transition:opacity .15s,-webkit-mask-image .15s,mask-image .15s;}
.td-text.ck{text-decoration:line-through;color:var(--fg3);}
.td-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .15s;position:absolute;right:2px;top:50%;transform:translateY(-50%);padding-left:26px;background:linear-gradient(to right,rgba(36,36,34,0),var(--bg2) 26%);pointer-events:none;}
.td-item:hover .td-actions{opacity:1;pointer-events:auto;}
.td-item:hover .td-text{-webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 90px),transparent 100%);mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 90px),transparent 100%);}
@media(max-width:700px){.td-actions{opacity:1;position:static;top:auto;right:auto;transform:none;padding-left:0;background:none;pointer-events:auto;}.td-item:hover .td-text,.td-text{-webkit-mask-image:none;mask-image:none;}}
.td-btn{background:none;border:none;cursor:pointer;color:var(--fg3);font-size:12px;padding:2px 4px;border-radius:3px;line-height:1;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;}
.td-btn:hover{background:var(--bg3);color:var(--fg);}
.td-btn.del:hover{color:var(--red);}
.td-drag-handle{cursor:grab;color:var(--fg3);font-size:13px;padding:0 3px;flex-shrink:0;line-height:1;user-select:none;touch-action:none;}
.td-drag-handle:active{cursor:grabbing;}
.td-item.td-dragging{opacity:.35;}
.td-item.td-drag-over{border-top:2px solid var(--blue) !important;}
.done-toggle{width:100%;background:none;border:none;cursor:pointer;color:var(--fg3);font-size:11px;padding:7px 2px 3px;text-align:left;display:flex;align-items:center;gap:5px;}
.done-toggle:hover{color:var(--fg2);}
.done-arrow{font-size:9px;transition:transform .2s;}
.done-toggle.open .done-arrow{transform:rotate(90deg);}
.done-list{display:none;}.done-list.open{display:block;}
.td-empty{font-size:12px;color:var(--fg3);padding:14px 0;text-align:center;}

/* ── ROUTINE ── */
.routine-scroll{max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
.hdr-stats{display:flex;align-items:center;gap:7px;}
.edit-toggle{background:none;border:.5px solid var(--b2);border-radius:var(--r);color:var(--fg3);cursor:pointer;font-size:11px;padding:4px 9px;}
.edit-toggle.active{border-color:var(--blue);color:var(--blue);}
.sel-hdr{margin-bottom:9px;}
.sel-date{font-size:14px;font-weight:500;}
.sel-count{font-size:13px;color:var(--fg2);margin-top:2px;}
.pb-wrap{height:3px;background:var(--bg);border-radius:2px;margin-top:6px;overflow:hidden;}
.pb-fill{height:100%;border-radius:2px;background:var(--green);transition:width .3s;}
.phase-block{margin-bottom:12px;}
.phase-lbl{font-size:12px;font-weight:600;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.blk-lbl{font-size:13px;color:var(--blue);margin:5px 0 2px 2px;}
.task-row{width:100%;margin-bottom:1px;}
.task-main{display:flex;align-items:center;width:100%;}
.task-btn{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:5px;cursor:pointer;border:none;background:transparent;flex:1;text-align:left;color:var(--fg);}
.task-btn:hover{background:var(--bg3);}
.task-btn.ck{color:var(--fg3);}
.cbx{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.cbx.ck{background:var(--green);border-color:var(--green);color:#EAF3DE;}
.tname{font-size:16px;line-height:1.45;}
.task-btn.ck .tname{text-decoration:line-through;}
.task-btn.hib{cursor:default;}.task-btn.hib:hover{background:transparent;}
.cbx.hib{border-style:dashed;border-color:var(--b);}
.tname.hib{color:var(--fg3);font-style:italic;}
.hib-badge{font-size:10px;color:var(--amber);background:rgba(186,117,23,.08);border:.5px solid rgba(186,117,23,.2);border-radius:100px;padding:1px 6px;margin-left:4px;flex-shrink:0;white-space:nowrap;}
.sub-tog{background:none;border:none;cursor:pointer;padding:3px 6px;color:var(--fg3);font-size:11px;flex-shrink:0;border-radius:3px;}
.sub-tog:hover{background:var(--bg3);}
.sub-list{display:none;padding:3px 8px 4px 28px;border-left:1.5px solid var(--b);margin-left:13px;margin-top:1px;}
.sub-list.open{display:block;}
.sub-item{font-size:13px;color:var(--fg2);padding:2px 0;line-height:1.5;}
.editor-wrap{display:none;}.editor-wrap.open{display:block;}
#card-routine.routine-editing #task-view{display:none !important;}
.ed-tabs{display:flex;gap:4px;margin-bottom:11px;}
.ed-tab{padding:4px 11px;border-radius:100px;border:.5px solid var(--b2);background:none;font-size:12px;cursor:pointer;color:var(--fg3);}
.ed-tab.on{border-color:var(--blue);color:var(--blue);}
.ed-section{margin-bottom:15px;}
.ed-phase-hdr{font-size:10px;font-weight:600;color:var(--fg3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
.ed-task{border-radius:7px;padding:7px 9px;margin-bottom:4px;border:.5px solid var(--b);}
.ed-task.live{background:var(--bg3);}
.ed-task.hibernated{background:rgba(186,117,23,.04);border-color:rgba(186,117,23,.18);}
.ed-task-top{display:flex;align-items:flex-start;gap:7px;min-width:0;}
.ed-task-main{display:flex;align-items:center;gap:5px;min-width:0;flex:1;}
.ed-task-side{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:0 0 auto;min-width:86px;}
.ed-name{flex:1;background:transparent;border:none;color:var(--fg);font-size:13px;outline:none;padding:2px 0;min-width:0;font-family:inherit;user-select:text;}
.ed-name:focus{border-bottom:1px solid var(--blue);}
.ed-name.dim{color:var(--fg3);font-style:italic;}
.ed-block-inp{width:78px;background:var(--bg2);border:.5px solid var(--b2);color:var(--fg2);font-size:11px;padding:3px 5px;border-radius:4px;outline:none;text-align:center;font-family:inherit;user-select:text;}
.ed-task-side .ed-block-inp,.ed-task-side .hib-btn,.ed-task-side .eib.del{width:100%;}
.eib{background:none;border:none;cursor:pointer;color:var(--fg3);font-size:12px;padding:3px 4px;border-radius:3px;line-height:1;}
.eib:hover{background:var(--bg2);color:var(--fg);}
.eib.del:hover{color:var(--red);}
.hib-btn{background:none;border:.5px solid var(--b2);border-radius:100px;cursor:pointer;font-size:10px;padding:2px 8px;color:var(--fg3);white-space:nowrap;flex-shrink:0;}
.hib-btn:hover{border-color:var(--amber);color:var(--amber);}
.hib-btn.active{border-color:var(--amber);color:var(--amber);}
.ed-subs{margin-top:5px;padding-left:8px;border-left:1.5px solid var(--b);}
.ed-sub-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.ed-sub-inp{flex:1;background:transparent;border:none;color:var(--fg2);font-size:12px;outline:none;padding:2px 0;min-width:0;font-family:inherit;user-select:text;}
.ed-sub-inp:focus{border-bottom:1px solid var(--blue);}
.ed-add-sub{background:none;border:none;cursor:pointer;color:var(--fg3);font-size:11px;padding:3px 0;}
.ed-add-sub:hover{color:var(--blue);}
.ed-sched{margin-top:6px;display:flex;flex-direction:column;gap:6px;}
.ed-sched-label{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;}
.ed-sched-days{display:flex;flex-wrap:wrap;gap:4px;}
.ed-day-btn{border:.5px solid var(--b2);background:var(--bg2);color:var(--fg3);font-size:10px;padding:2px 6px;border-radius:100px;cursor:pointer;}
.ed-day-btn.on{border-color:var(--blue);color:var(--blue);background:rgba(55,138,221,.1);} 
.ed-sched-range{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ed-date-inp{background:var(--bg2);border:.5px solid var(--b2);color:var(--fg2);font-size:11px;padding:3px 6px;border-radius:4px;outline:none;font-family:inherit;}
.ed-date-inp:focus{border-color:var(--blue);}
.add-form{background:var(--bg3);border:.5px solid var(--b);border-radius:7px;padding:8px 10px;margin-top:5px;}
.add-form-title{font-size:10px;color:var(--fg3);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;}
.add-row{display:flex;gap:5px;flex-wrap:wrap;}
.add-inp{flex:1;min-width:100px;background:var(--bg2);border:.5px solid var(--b2);color:var(--fg);padding:5px 8px;border-radius:5px;font-size:13px;outline:none;font-family:inherit;user-select:text;}
.add-btn-g{padding:5px 12px;border-radius:5px;border:none;cursor:pointer;background:var(--green);color:#EAF3DE;font-size:13px;font-weight:500;}
.add-btn-g:hover{background:var(--gdk);}


/* ── FOCUS TIMER ── */
.timer-inner{display:flex;flex-direction:column;position:relative;}
.timer-between-quote{
  flex:0 0 auto;
  min-height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:serif;
  font-size:12px;
  font-style:italic;
  font-weight:200;
  letter-spacing:.03em;
  line-height:1.35;
  color:var(--fg3);
  opacity:.75;
  padding:0 6px 0px;
  pointer-events:none;
  white-space:nowrap;
  overflow:hidden;
  margin:0;
}
.timer-between-quote .quote-text{
  display:inline-block;
  white-space:nowrap;
  will-change:transform;
}
.timer-between-quote.marquee{
  justify-content:flex-start;
}
.timer-between-quote.marquee .quote-text{
  padding-left:calc(100% + 16px);
  animation:quote-marquee var(--quote-marquee-duration,14s) linear infinite;
}
.top-quote{
  display:flex;
  min-height:0;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:"serif";
  font-size:12px;
  font-style:italic;
  font-weight:200;
  letter-spacing:.03em;
  line-height:1.35;
  color:var(--fg3);
  opacity:.75;
  padding:0 6px;
  pointer-events:none;
  white-space:nowrap;
  overflow:hidden;
  margin:0 0 12px;
}
.top-quote .quote-text{display:inline-block;white-space:nowrap;will-change:transform;}
.top-quote.marquee{justify-content:flex-start;}
.top-quote.marquee .quote-text{padding-left:calc(100% + 16px);animation:quote-marquee var(--quote-marquee-duration,14s) linear infinite;}
#daily-quote-mobile{display:none;}
@keyframes quote-marquee{
  from{transform:translateX(0);}
  to{transform:translateX(calc(-1 * var(--quote-marquee-distance,100%)));}
}
/* weekly bars */
.timer-hdr-right{display:flex;align-items:center;gap:8px;}
.tw-header-row{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.tw-grid{display:flex;gap:4px;}
.tw-settings-anchor{position:relative;display:flex;align-items:center;flex-shrink:0;}
.tw-day{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;}
.tw-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;letter-spacing:.02em;color:var(--fg);background:rgba(0,0,0,.5);pointer-events:none;z-index:1;}
.tw-bar-wrap{position:relative;width:20px;height:20px;background:var(--bg3);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;border:.5px solid var(--b);}
.tw-bar-fill{position:relative;z-index:0;border-radius:1px;background:var(--blue);transition:height .3s;}
.tw-hrs{font-size:8px;color:var(--fg3);min-height:10px;text-align:center;}
/* main row: time display left, controls right, vertically centered */
.timer-main-row{display:flex;align-items:center;gap:12px;}
.timer-left{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}
.timer-disp-wrap{position:relative;display:inline-block;width:7ch;}
.timer-disp{display:block;white-space:nowrap;font-size:38px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1;cursor:pointer;}
.timer-disp:hover{color:var(--blue);}
.timer-disp.running-focus{color:var(--blue);}
.timer-disp.running-brk{color:var(--green);}
.timer-disp.done{color:var(--green);}
.timer-disp[contenteditable="true"]{outline:none;color:var(--blue);caret-color:var(--blue);}
.timer-phase-row{display:flex;align-items:center;gap:5px;min-height:16px;}
.phase-badge{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:100px;}
.phase-badge.focus{color:var(--blue);background:rgba(55,138,221,.12);border:.5px solid rgba(55,138,221,.25);}
.phase-badge.brk{color:var(--green);background:rgba(99,153,34,.12);border:.5px solid rgba(99,153,34,.25);}
.timer-total-rem{font-size:10px;color:var(--fg3);}
.timer-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.timer-ctrl-row{display:flex;align-items:center;gap:5px;}
.tbtn{border:none;border-radius:var(--r);padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;}
.tbtn.start,.tbtn.pause,.tbtn.stop{text-align:center;min-width:62px;}
.tbtn.hidden{visibility:hidden;pointer-events:none;}
.tbtn.start{background:var(--blue);color:#fff;}
.tbtn.start:hover{background:#2a73c5;}
.tbtn.pause,.tbtn.stop{background:var(--bg3);color:var(--fg2);border:.5px solid var(--b2);}
.tbtn.pause:hover,.tbtn.stop:hover{background:var(--bg4);}
.tbtn.settings{background:none;border:none;color:var(--fg3);padding:4px 6px;font-size:14px;line-height:1;}
.tbtn.settings:hover{color:var(--fg2);}
.tbtn.settings.on{color:var(--blue);}
/* settings panel */
.timer-settings{background:var(--bg3);border:.5px solid var(--b);border-radius:var(--r);padding:9px 11px;margin-top:0;display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:200px;}
.timer-settings.open{display:block;}
.timer-presets{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.preset-btn{font-size:10px;color:var(--fg3);background:none;border:.5px solid var(--b2);border-radius:100px;padding:2px 8px;cursor:pointer;white-space:nowrap;}
.preset-btn:hover{color:var(--fg2);}
.preset-btn.on{color:var(--blue);border-color:var(--blue);background:rgba(55,138,221,.08);}
.timer-custom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.timer-custom-lbl{font-size:10px;color:var(--fg3);}
.tiny-inp{width:46px;background:var(--bg2);border:.5px solid var(--b2);border-radius:4px;color:var(--fg);font-size:12px;font-family:inherit;padding:3px 5px;outline:none;text-align:center;user-select:text;}
.tiny-inp:focus{border-color:var(--blue);}
/* log row – removed in favour of inline Log/Skip buttons */
.tbtn.log{background:var(--green);color:#EAF3DE;flex-shrink:0;}
.tbtn.log:hover{background:var(--gdk);}
/* session plan text */
.timer-plan{font-size:10px;color:var(--fg2);text-align:center;min-height:14px;margin-bottom:4px;}
/* session overall progress bar */
.timer-sess-bar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:6px;visibility:hidden;opacity:0;transition:opacity .15s;}
.timer-sess-fill{height:100%;border-radius:2px;background:var(--blue);transition:width 1s linear;}
/* goal progress popover */
.goal-prog-pop{position:fixed;background:var(--bg3);border:.5px solid var(--b2);border-radius:8px;padding:10px 12px;z-index:300;display:flex;flex-direction:column;gap:7px;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.goal-prog-pop-lbl{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;}
.goal-prog-pop-row{display:flex;align-items:center;gap:8px;}
.goal-prog-pop-range{flex:1;accent-color:var(--green);cursor:pointer;}
.goal-prog-pop-pct{font-size:13px;font-weight:600;color:var(--fg);min-width:32px;text-align:right;}
.goal-prog-pop-btn{background:var(--green);color:#EAF3DE;border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;align-self:flex-end;}
.goal-prog-pop-btn:hover{background:var(--gdk);}

/* ── HEATMAP ── */
.hmap-month-row{padding-left:calc(var(--hmap-dow-width) + var(--hmap-gap));display:grid;margin-bottom:2px;column-gap:var(--hmap-gap);}
.hmap-body{display:flex;gap:var(--hmap-gap);}
.hmap-dow-col{display:flex;flex-direction:column;gap:var(--hmap-gap);flex-shrink:0;width:var(--hmap-dow-width);}
.hmap-dow-lbl{font-size:9px;color:var(--fg3);height:var(--hmap-cell);line-height:var(--hmap-cell);text-align:right;padding-right:3px;}
.hmap-cols-wrap{display:grid;gap:var(--hmap-gap);flex:1;}
.hmap-week-col{display:grid;gap:var(--hmap-gap);grid-auto-rows:var(--hmap-cell);}
.hc{width:var(--hmap-cell);height:var(--hmap-cell);border-radius:2px;border:.5px solid transparent;cursor:pointer;transition:border-color .1s;}
.hc:hover{border-color:var(--fg3);}
.hc.today{border-color:var(--blue) !important;}
.hc.selected{border-color:rgba(55,138,221,.6) !important;}
.hc.empty{background:transparent !important;cursor:default;border:none;}
.hmap-legend{
  display:flex;
  align-items:center;
  gap:2px;
  margin-top:7px;
  justify-content:flex-end;
  flex-wrap:wrap;
  max-width:100%;
}
.lc{width:9px;height:9px;border-radius:1px;flex-shrink:0;}
.leg-txt{font-size:9px;color:var(--fg3);white-space:nowrap;}

/* ── NOTES OVERLAY ── */
.notes-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;}
.notes-overlay.open{display:flex;}
.notes-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--b);flex-shrink:0;}
.notes-back{background:none;border:.5px solid var(--b2);border-radius:var(--r);color:var(--fg3);cursor:pointer;font-size:12px;padding:4px 10px;flex-shrink:0;}
.notes-back:hover{color:var(--fg);}
.notes-overlay-title{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;flex:1;text-align:center;}
.notes-new-btn{background:var(--green);color:#EAF3DE;border:none;border-radius:var(--r);font-size:12px;padding:5px 12px;cursor:pointer;flex-shrink:0;}
.notes-new-btn:hover{background:var(--gdk);}
.notes-grid-wrap{flex:1;overflow-y:auto;padding:14px;}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;}
/* extra left inset so card text does not collide with drag handle */
.note-card{--content-offset:10px;background:var(--bg2);border:.5px solid var(--b);border-radius:var(--rl);padding:13px;cursor:pointer;transition:border-color .15s;min-height:100px;display:flex;flex-direction:column;gap:6px;position:relative;}
.note-card:hover{border-color:var(--b2);background:var(--bg3);}
.note-card.dragging{opacity:.3;}
.note-card.drag-over{border-color:var(--blue);}
.note-card-drag-handle{position:absolute;top:8px;left:8px;font-size:12px;color:var(--fg3);cursor:grab;user-select:none;}
.note-card-title{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px;padding-right:66px;}
.note-card-preview{font-size:12px;color:var(--fg3);line-height:1.5;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
.note-card-date{font-size:10px;color:var(--fg3);margin-top:auto;}
.note-card-title,.note-card-preview,.note-card-date{padding-left:var(--content-offset);}
.note-card-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--fg3);font-size:12px;padding:2px 4px;border-radius:3px;opacity:0;}
.note-card:hover .note-card-del{opacity:1;}
.note-card-del:hover{color:var(--red);}
.note-card-pin{position:absolute;top:8px;right:32px;background:none;border:none;cursor:pointer;color:var(--fg3);font-size:10px;padding:2px 4px;border-radius:3px;opacity:0;}
.note-card:hover .note-card-pin{opacity:1;}
.note-card-pin.active{color:var(--blue);opacity:1;}
.notes-empty{text-align:center;padding:60px 20px;color:var(--fg3);font-size:13px;}
.note-editor-wrap{flex:1;display:none;flex-direction:column;overflow:hidden;}
.note-editor-wrap.open{display:flex;}
.note-editor-header{display:grid;grid-template-columns:minmax(0,420px);justify-content:center;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--b);flex-shrink:0;}
.note-title-inp{width:100%;background:transparent;border:none;color:var(--fg);font-size:15px;font-weight:600;outline:none;font-family:inherit;min-width:0;user-select:text;text-align:center;}
.note-title-inp::placeholder{color:var(--fg3);}
.note-save-btn{background:var(--green);color:#EAF3DE;border:none;border-radius:var(--r);font-size:12px;padding:5px 12px;cursor:pointer;flex-shrink:0;}
.note-save-btn:hover{background:var(--gdk);}
.note-toolbar{display:flex;align-items:center;gap:2px;padding:7px 14px;border-bottom:.5px solid var(--b);flex-wrap:wrap;flex-shrink:0;background:var(--bg2);}
.ntb{background:none;border:none;cursor:pointer;color:var(--fg2);font-size:13px;padding:4px 7px;border-radius:4px;line-height:1;font-family:inherit;}
.ntb:hover{background:var(--bg3);color:var(--fg);}
.ntb-sep{width:1px;height:16px;background:var(--b2);margin:0 3px;flex-shrink:0;}
.note-body{flex:1;overflow-y:auto;padding:16px 14px;outline:none;font-size:14px;line-height:1.7;color:var(--fg);caret-color:var(--blue);user-select:text;}
.note-body:empty::before{content:attr(data-placeholder);color:var(--fg3);pointer-events:none;}
.note-body h1{font-size:22px;font-weight:700;margin:14px 0 6px;}
.note-body h2{font-size:18px;font-weight:600;margin:12px 0 5px;}
.note-body h3{font-size:15px;font-weight:600;margin:10px 0 4px;color:var(--fg2);}
.note-body p{margin:3px 0;}
.note-body ul,.note-body ol{padding-left:22px;margin:4px 0;}
.note-body li{margin:2px 0;}
.note-body blockquote{border-left:3px solid var(--blue);padding:4px 12px;margin:6px 0;color:var(--fg2);font-style:italic;}
.note-body hr{border:none;border-top:.5px solid var(--b2);margin:12px 0;}
.note-body code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:12px;font-family:monospace;}
.note-body pre{background:var(--bg3);border-radius:7px;padding:10px 12px;overflow-x:auto;font-size:12px;font-family:monospace;margin:8px 0;}
.note-body .note-check{display:flex;align-items:baseline;gap:8px;margin:3px 0;}
.note-body .note-check input[type=checkbox]{accent-color:var(--green);cursor:pointer;flex-shrink:0;transform:translateY(1px);}
.note-body .note-check.done span{text-decoration:line-through;color:var(--fg3);}
.note-body details{background:var(--bg3);border:.5px solid var(--b);border-radius:6px;padding:6px 10px;margin:5px 0;}
.note-body details summary{cursor:pointer;color:var(--fg2);font-size:13px;font-weight:500;outline:none;list-style:none;}
.note-body details summary::-webkit-details-marker{display:none;}
.note-body details summary::before{content:"▶ ";font-size:10px;}
.note-body details[open] summary::before{content:"▼ ";}
.note-body details .toggle-content{padding:6px 0 2px;}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:.5px solid var(--b2);border-radius:var(--rm);padding:8px 16px;font-size:12px;color:var(--fg2);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;}

/* ── GOAL TILES ── */
.goal-bento-card{aspect-ratio:auto;height:128px;padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;cursor:pointer;transition:border-color .15s,background .15s;}
.goal-bento-card:hover{border-color:var(--b2);background:var(--bg3);}
.goal-bento-card.editing{cursor:grab;}
.goal-bento-card.dragging{opacity:.55;}
.goal-bento-card.drag-over{border-color:var(--blue);background:rgba(55,138,221,.08);}
.goals-row{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;}
.goals-edit-row{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin:2px 0 1px;}
.goals-edit-line{flex:1;height:1px;background:var(--b2);}
.goals-edit-btn{font-size:11px;color:var(--fg3);background:none;border:.5px solid var(--b2);border-radius:100px;padding:4px 10px;cursor:pointer;white-space:nowrap;}
.goals-edit-btn:hover{color:var(--fg2);}
.goals-edit-btn.on{color:var(--blue);border-color:var(--blue);background:rgba(55,138,221,.08);}
.goal-card-edit-row{display:none;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.goal-bento-card.editing .goal-card-edit-row{display:flex;margin-top:auto;}
.goal-edit-btn{font-size:10px;background:var(--bg3);border:.5px solid var(--b2);color:var(--fg3);border-radius:6px;padding:2px 6px;cursor:pointer;}
.goal-edit-btn:hover{color:var(--fg2);}
.goal-edit-btn.drag{cursor:grab;}
.goal-add-card{display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;color:var(--fg3);user-select:none;}
.goal-add-card span{font-size:11px;line-height:1.1;display:block;margin-top:6px;color:var(--fg3);}
.goal-tile-emoji{font-size:20px;margin-bottom:3px;}
.goal-tile-name{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
.goal-tile-desc{font-size:11px;color:var(--fg3);margin-top:1px;}
.goal-week-target{display:block;font-size:10px;color:var(--fg2);margin-top:2px;line-height:1.35;padding-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goal-week-target b{color:var(--fg);}
.goal-week-target-done{color:var(--blue);margin-left:5px;font-weight:700;}
.goal-daily-list{display:flex;flex-direction:column;gap:5px;margin-top:4px;min-height:34px;}
.goal-daily-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--fg2);line-height:1.35;background:rgba(255,255,255,.02);border:.5px solid var(--b);border-radius:7px;padding:3px 6px;}
.goal-daily-item input[type=checkbox]{margin-top:1px;appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--b2);border-radius:4px;background:var(--bg3);cursor:pointer;flex-shrink:0;position:relative;transition:border-color .15s,background .15s;}
.goal-daily-item input[type=checkbox]:checked{background:var(--green);border-color:var(--green);}
.goal-daily-item input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;border:solid #EAF3DE;border-width:0 2px 2px 0;transform:rotate(45deg);}
.goal-daily-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goal-daily-item.done span{text-decoration:line-through;color:var(--fg3);}
.goal-daily-empty{font-size:10px;color:var(--fg3);font-style:italic;}
.goal-progress-ring{position:absolute;top:9px;right:9px;width:34px;height:34px;}

/* ── NOTES STRIP ── */
.notes-strip-card{padding:11px 12px;}
.notes-strip-hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;margin-bottom:8px;gap:8px;}
.notes-strip-lbl{font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.notes-see-all{font-size:11px;color:var(--fg3);background:none;border:.5px solid var(--b2);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;justify-self:end;max-width:100%;}
.notes-see-all:hover{color:var(--fg2);}
.notes-quick-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;min-width:0;}
.notes-quick-inp-wrap{position:relative;flex:1;min-width:0;}
.notes-quick-inp{flex:1;min-width:0;width:100%;max-width:100%;display:block;background:var(--bg3);border:.5px solid var(--b2);border-radius:7px;color:var(--fg);font-size:12px;font-family:inherit;padding:7px 9px;outline:none;line-height:1.45;resize:none;height:52px;overflow-y:auto;user-select:text;}
.notes-quick-inp:focus{border-color:var(--blue);}
.notes-quick-inp::placeholder{color:var(--fg3);}
.notes-quick-add{background:var(--green);color:#EAF3DE;border:none;border-radius:7px;min-width:62px;height:36px;padding:0 12px;font-size:12px;cursor:pointer;flex-shrink:0;}
.notes-quick-add:hover{background:var(--gdk);}
.notes-quick-add-inside{position:absolute;right:7px;bottom:7px;z-index:2;min-width:50px;height:28px;padding:0 10px;font-size:11px;}
.quick-note-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:320;padding:18px;}
.quick-note-dialog.open{display:flex;}
.quick-note-card{width:min(520px,100%);background:var(--bg2);border:.5px solid var(--b2);border-radius:14px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;}
.quick-note-title{font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;}
.quick-note-dialog-inp{width:100%;min-height:210px;max-height:56vh;background:var(--bg3);border:.5px solid var(--b2);border-radius:10px;color:var(--fg);font-size:13px;font-family:inherit;line-height:1.45;padding:10px 11px;resize:vertical;outline:none;user-select:text;}
.quick-note-dialog-inp:focus{border-color:var(--blue);}
.quick-note-actions{display:flex;justify-content:flex-end;gap:7px;}
.quick-note-btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;}
.quick-note-btn.cancel{background:var(--bg3);color:var(--fg2);border:.5px solid var(--b2);}
.quick-note-btn.add{background:var(--green);color:#EAF3DE;}
.pin-replace-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:330;padding:18px;}
.pin-replace-dialog.open{display:flex;}
.pin-replace-card{width:min(520px,100%);background:var(--bg2);border:.5px solid var(--b2);border-radius:14px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;}
.pin-replace-title{font-size:11px;font-weight:600;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;}
.pin-replace-msg{font-size:12px;color:var(--fg2);line-height:1.45;}
.pin-replace-actions{display:flex;justify-content:flex-end;gap:7px;}
.pin-replace-btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;}
.pin-replace-btn.cancel{background:var(--bg3);color:var(--fg2);border:.5px solid var(--b2);}
.pin-replace-btn.replace{background:var(--blue);color:#fff;}
.notes-preview-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.notes-preview-card{background:var(--bg3);border:.5px solid var(--b);border-radius:7px;padding:7px 8px;cursor:pointer;text-align:left;min-height:46px;max-width:100%;overflow:hidden;}
.notes-preview-card:hover{border-color:var(--b2);background:var(--bg4);}
.notes-preview-title{font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.notes-preview-text{font-size:11px;color:var(--fg3);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere;min-width:0;}
.notes-preview-empty{font-size:11px;color:var(--fg3);padding:6px 2px;}

/* ── GOAL OVERLAY ── */
.goal-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;}
.goal-overlay.open{display:flex;}
.goal-overlay-info{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;min-width:0;}
.goal-overlay-emoji{font-size:20px;cursor:pointer;padding:3px 5px;border-radius:5px;outline:none;line-height:1;}
.goal-overlay-emoji:hover{background:var(--bg3);}
.goal-overlay-name{font-size:14px;font-weight:600;outline:none;cursor:text;padding:2px 5px;border-radius:4px;border-bottom:1.5px solid transparent;min-width:40px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goal-overlay-name:focus{border-bottom-color:var(--blue);}
.goal-overlay-name:empty::before{content:attr(data-placeholder);color:var(--fg3);}
.goal-colors{display:flex;gap:5px;flex-shrink:0;}
.goal-color-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s;flex-shrink:0;}
.goal-color-dot.on{border-color:var(--fg);}
.goal-overlay-body{flex:1;overflow-y:auto;padding:20px 16px 40px;max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;}
.goal-ring-section{display:flex;flex-direction:column;align-items:center;gap:8px;}
.goal-ring-big{width:96px;height:96px;}
.goal-progress-row{display:flex;align-items:center;gap:10px;width:100%;}
.goal-progress-row input[type=range]{flex:1;accent-color:var(--green);height:4px;cursor:pointer;}
.goal-progress-pct{font-size:13px;color:var(--fg2);min-width:34px;text-align:right;}
.goal-section-lbl{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.goal-desc-inp{width:100%;background:var(--bg3);border:.5px solid var(--b);border-radius:var(--r);color:var(--fg);font-size:13px;font-family:inherit;padding:9px 11px;outline:none;line-height:1.5;min-height:64px;resize:vertical;box-sizing:border-box;}
.goal-desc-inp:focus{border-color:var(--blue);}
.goal-calendar-wrap{display:flex;flex-direction:column;gap:8px;}
.goal-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px;}
.goal-calendar-add{background:var(--green);color:#EAF3DE;border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(22,69,2,.25);}
.goal-calendar-add:hover{background:var(--gdk);}
.goal-cal-range{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.goal-cal-range-date,.goal-cal-range-task{background:var(--bg3);border:.5px solid var(--b2);border-radius:6px;color:var(--fg);font-size:11px;font-family:inherit;padding:5px 7px;outline:none;box-sizing:border-box;}
.goal-cal-range-date:focus,.goal-cal-range-task:focus{border-color:var(--blue);}
.goal-cal-range-task{min-width:170px;}
.goal-cal-range-btn{background:none;border:.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}
.goal-cal-range-btn:hover{background:rgba(59,111,245,.08);}
.goal-calendar-scroll{overflow:hidden;border:.5px solid var(--b);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));}
.goal-calendar-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:0;}
.goal-calendar-table th,.goal-calendar-table td{border-bottom:.5px solid var(--b);padding:8px 8px;vertical-align:top;}
.goal-calendar-table th{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;text-align:left;background:rgba(255,255,255,.02);}
.goal-calendar-table td{font-size:12px;color:var(--fg2);}
.goal-calendar-table tbody tr:hover td{background:rgba(255,255,255,.015);}
.goal-calendar-table tr:last-child td{border-bottom:none;}
.goal-cal-date,.goal-cal-task-txt,.goal-cal-weekly{width:100%;background:var(--bg3);border:.5px solid var(--b2);border-radius:6px;color:var(--fg);font-size:12px;font-family:inherit;padding:6px 7px;outline:none;box-sizing:border-box;}
.goal-cal-date:focus,.goal-cal-task-txt:focus,.goal-cal-weekly:focus{border-color:var(--blue);}
.goal-cal-day{font-size:11px;color:var(--fg2);font-weight:600;padding-top:7px;white-space:nowrap;}
.goal-cal-task-list{display:flex;flex-direction:column;gap:6px;min-width:0;}
.goal-cal-task-row{display:flex;align-items:center;gap:6px;}
.goal-cal-task-txt,.goal-cal-weekly{flex:1;min-width:0;}
.goal-cal-task-done,.goal-cal-weekly-done{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--b2);border-radius:4px;background:var(--bg3);cursor:pointer;flex-shrink:0;position:relative;transition:border-color .15s,background .15s;}
.goal-cal-task-done:checked,.goal-cal-weekly-done:checked{background:var(--green);border-color:var(--green);}
.goal-cal-task-done:checked::after,.goal-cal-weekly-done:checked::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;border:solid #EAF3DE;border-width:0 2px 2px 0;transform:rotate(45deg);}
.goal-cal-task-del{background:none;border:.5px solid var(--b2);color:var(--fg3);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;flex-shrink:0;}
.goal-cal-task-del:hover{color:var(--red);border-color:var(--red);}
.goal-cal-task-add{background:none;border:.5px dashed var(--b2);color:var(--fg3);border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;align-self:flex-start;margin-left:20px;}
.goal-cal-task-add:hover{color:var(--fg2);border-color:var(--blue);}
.goal-cal-weekly{border-color:rgba(186,117,23,.55);}
.goal-cal-weekly-wrap{display:flex;align-items:center;gap:6px;padding:0;border:none;background:transparent;margin-bottom:6px;}
.goal-cal-weekly-spacer{width:26px;flex-shrink:0;visibility:hidden;pointer-events:none;}
.goal-cal-row-pct{font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;padding-top:7px;}
.goal-cal-agg{font-size:11px;color:var(--fg2);font-weight:600;}
.goal-cal-del{background:none;border:.5px solid var(--b2);color:var(--fg3);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;}
.goal-cal-del:hover{color:var(--red);border-color:var(--red);}
.goal-cal-note{font-size:10px;color:var(--fg3);padding:0 2px;}

/* ── PAGE OVERLAY ── */
.page-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;}
.page-overlay.open{display:flex;}
.page-overlay-title-wrap{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;}
.page-overlay-emoji{font-size:18px;cursor:pointer;outline:none;padding:2px 4px;border-radius:4px;line-height:1;}
.page-overlay-emoji:hover{background:var(--bg3);}
.page-overlay-name-inp{background:transparent;border:none;color:var(--fg2);font-size:13px;font-weight:600;letter-spacing:.04em;outline:none;font-family:inherit;text-align:center;width:140px;cursor:text;border-bottom:1.5px solid transparent;}
.page-overlay-name-inp:focus{border-bottom-color:var(--blue);color:var(--fg);}
.page-overlay-body{flex:1;overflow-y:auto;padding:16px 14px;outline:none;font-size:14px;line-height:1.7;color:var(--fg);caret-color:var(--blue);user-select:text;}
.page-overlay-body:empty::before{content:attr(data-placeholder);color:var(--fg3);pointer-events:none;}

/* ── NOTES overlay title editable ── */
.notes-overlay-title[contenteditable=true]{cursor:text;outline:none;border-bottom:1.5px solid transparent;}
.notes-overlay-title[contenteditable=true]:focus{border-bottom-color:var(--blue);}
.notes-overlay-title:empty::before{content:attr(data-placeholder);color:var(--fg3);}

/* ── HEATMAP overflow ── */
#heatmap-wrap{overflow-x:hidden;}

<script>
// ════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════
const PHASES=["Morning","Midday","Evening","Night"];
const MSHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DLBL=["S","M","T","W","T","F","S"];
const GOALS_GRID_BREAKPOINT=700;
const GOALS_COLS_DESKTOP=4;
const GOALS_COLS_MOBILE=2;
const LS={R:"hdash-routine",T:"hdash-todos",N:"hdash-notes",F:"hdash-focus",GL:"hdash-goals",PC:"hdash-pagecfg",PX:"hdash-pagecontent",Q:"hdash-quote-cache-v1"};
const WEEKS=18;
const GOAL_COLORS={blue:"var(--blue)",green:"var(--green)",amber:"var(--amber)",red:"var(--red)",default:"#fff"};
const DEFAULT_GOALS=[
  {id:"career",emoji:"",name:"Career",desc:"",color:"default",progress:0,order:0},
  {id:"mind",emoji:"",name:"Mind",desc:"",color:"default",progress:0,order:1},
  {id:"soul",emoji:"",name:"Soul",desc:"",color:"default",progress:0,order:2},
  {id:"body",emoji:"",name:"Body",desc:"",color:"default",progress:0,order:3},
];
const DEFAULT_PAGE_CFG={
  notes:  {name:"Notes",   emoji:"📝"},
  journal:{name:"Journal", emoji:"📔"},
  reading:{name:"Reading", emoji:"📖"},
  movies: {name:"Movies",  emoji:"🎬"},
};
const DEFAULT_TASKS=[];
const GOAL_TILE_DAILY_LIMIT=2;
// Samsung S23-class compact layout tuning
const COMPACT_PHONE_MAX_WIDTH=430;
const MOBILE_SAVE_ROW_MAX_WIDTH=700;
const MOBILE_SAVE_TEXT_VISIBLE_MS=2600;
const COMPACT_TODO_VISIBLE_LIMIT=8;
const COMPACT_ROUTINE_VISIBLE_LIMIT=5;
const ROUTINE_TRASH_RETENTION_DAYS=7;
const compactPhoneMQ=window.matchMedia(`(max-width:${COMPACT_PHONE_MAX_WIDTH}px)`);
const mobileSaveRowMQ=window.matchMedia(`(max-width:${MOBILE_SAVE_ROW_MAX_WIDTH}px)`);
const isCompactPhoneView=()=>compactPhoneMQ.matches;
const isMobileSaveRowView=()=>mobileSaveRowMQ.matches;

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let RDATA={},RTASKS=[],RDAYS={},RMETA={},TODOS=[],NOTES=[],FOCUS={sessions:[]};
let routineSnapshotDirty=false;
let GOALS=[],PAGE_CFG={},PAGE_CONTENT={journal:"",reading:"",movies:""};
let edMode=false,edTab="active",doneOpen=false,toastT=null;
let goalsEditMode=false,goalDragId=null;
let tInt=null,tRunning=false,tPaused=false;
let tPhase="focus",tCycle=0,tPhaseElapsed=0,tSessElapsed=0,tFocusSecs=0;
let tPlan=[],tPlanIdx=0,tPhaseDur=0;
let tSessMins=30,tFocusMins=25,tBrkMins=5;
let _selDay="",_lastTick="",notesDragId=null,todosDragId=null,currentNoteId=null,currentGoalId=null,currentPageId=null;
const DAILY_QUOTES=[
  "Small steps, repeated daily, compound into big outcomes.",
  "Consistency beats intensity when done for long enough.",
  "Protect your focus; your future self depends on it.",
  "Do the next clear thing, then the next.",
  "Progress is quiet—keep showing up.",
  "Discipline is remembering what you want most.",
  "Today’s effort is tomorrow’s confidence.",
  "A calm plan executed daily wins."
];
const QUOTE_API_ENDPOINTS=[
  "https://zenquotes.io/api/today",
  "https://api.quotable.io/random?maxLength=140"
];
const QUOTE_API_TIMEOUT_MS=4500;
const DAY_LABELS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let timerAudioCtx=null;
let timerAudioUnlocked=false;

// ════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const todayKey=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");};
const dKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate=ds=>{if(!ds)return"";const[y,m,d]=ds.split("-");return parseInt(d)+" "+MSHORT[parseInt(m)-1]+" "+y;};
const nowTime=()=>{const n=new Date();return n.getHours()+":"+String(n.getMinutes()).padStart(2,"0");};
const nowISO=()=>new Date().toISOString();
const stripHtml=h=>{const t=document.createElement("div");t.innerHTML=h;return t.textContent||t.innerText||"";};
const normalizeGoalEmoji=e=>(e||"").trim()==="🎯"?"":(e||"").trim();
const normalizeDayKey=val=>{
  const m=String(val||"").trim().match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:"";
};
const normalizeRoutineMeta=meta=>{
  const src=(meta&&typeof meta==="object")?meta:{};
  return{
    lastSnapshotDay:normalizeDayKey(src.lastSnapshotDay),
    lastActiveDay:normalizeDayKey(src.lastActiveDay)
  };
};
const parseYMD=ds=>{
  const m=normalizeDayKey(ds).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return null;
  const y=Number(m[1]),mo=Number(m[2])-1,d=Number(m[3]);
  const dt=new Date(y,mo,d);
  return (dt.getFullYear()===y&&dt.getMonth()===mo&&dt.getDate()===d)?dt:null;
};
const nextDayKey=dayKey=>{
  const dt=parseYMD(dayKey);
  if(!dt)return "";
  dt.setDate(dt.getDate()+1);
  return dKey(dt);
};
const isSundayKey=ds=>{const dt=parseYMD(ds);return !!dt&&dt.getDay()===0;};
const dayLabelForDate=ds=>{
  const dt=parseYMD(ds);
  if(!dt)return "";
  return DAY_LABELS[dt.getDay()];
};
const weekStartMondayKey=ds=>{
  const dt=parseYMD(ds)||new Date();
  const copy=new Date(dt);
  const day=copy.getDay();
  const diff=day===0?-6:1-day;
  copy.setDate(copy.getDate()+diff);
  return dKey(copy);
};
const weekEndSundayKey=ds=>{
  const start=parseYMD(weekStartMondayKey(ds));
  start.setDate(start.getDate()+6);
  return dKey(start);
};
const normalizeGoalCalendarRows=rows=>{
  if(!Array.isArray(rows))return [];
  const normalizeGoalItems=list=>{
    const src=Array.isArray(list)?list:[];
    return src
      .map(item=>{
        if(typeof item==="string")return{id:genId(),text:item,done:false};
        if(!item||typeof item!=="object")return{id:genId(),text:"",done:false};
        return{id:String(item.id||genId()),text:String(item.text||""),done:!!item.done};
      })
      .map(item=>({id:item.id,text:String(item.text||"").trim(),done:!!item.done}))
      .filter(item=>item.text);
  };
  return rows
    .map(r=>{
      const date=String((r&&r.date)||"").trim();
      if(!parseYMD(date))return null;
      const dailyGoals=normalizeGoalItems((r&&r.dailyGoals)||[]);
      const mainGoal=String((r&&(r.mainGoal??r.weeklyGoal))||"").trim();
      const mainDone=!!(r&&(r.mainDone??r.weeklyDone));
      return{
        date,
        dailyGoals,
        mainGoal,
        mainDone,
        weeklyGoal:mainGoal,
        weeklyDone:mainDone

    const fromPos=RTASKS.findIndex(t=>t.id===a.id),toPos=RTASKS.findIndex(t=>t.id===b.id);
    if(fromPos<0||toPos<0)return false;
    [RTASKS[fromPos],RTASKS[toPos]]=[RTASKS[toPos],RTASKS[fromPos]];
    touchRoutineTask(RTASKS[fromPos]);
    touchRoutineTask(RTASKS[toPos]);
  }
  reindexRoutineTaskOrder();
  return true;
};
const ensureRoutineDaySnapshot=(dayKey,{force=false,includeHistory=true}={})=>{
  const day=normalizeDayKey(dayKey)||dayKey;
  if(!day)return null;
  const existing=RDAYS[day];
  if(existing&&Array.isArray(existing.tasks)&&existing.tasks.length&&!force&&!isRoutineSnapshotPartial(day,existing))return existing;
  const base=(tasksOnDay(day)||[]).map(routineTaskSnapshot).filter(Boolean);
  const byId=new Map(base.map(t=>[t.id,t]));
  if(includeHistory){
    const row=RDATA[day]||{};
    Object.keys(row).forEach(rawId=>{
      const id=String(rawId||"").trim();
      if(!id||byId.has(id))return;
      const def=RTASKS.find(t=>String(t.id)===id);
      const snap=def?routineTaskSnapshot(def):normalizeRoutineSnapshotTask({id,name:"(Deleted task)",phase:"Morning",block:"",order:Number.MAX_SAFE_INTEGER});
      if(snap)byId.set(id,snap);
    });
  }
  const tasks=[...byId.values()].sort(compareRoutineTasks);
  if(!tasks.length)return null;
  const snap={tasks,createdAt:day,partial:false};
  RDAYS[day]=snap;
  routineSnapshotDirty=true;
  return snap;
};
const upsertRoutineDaySnapshotTask=(dayKey,rawTask)=>{
  const day=normalizeDayKey(dayKey)||dayKey;
  const snapTask=normalizeRoutineSnapshotTask(rawTask);
  if(!day||!snapTask)return;
  const existing=RDAYS[day]&&Array.isArray(RDAYS[day].tasks)?RDAYS[day]:{tasks:[],createdAt:day,partial:true};
  const idx=existing.tasks.findIndex(t=>t.id===snapTask.id);
  if(idx>=0)existing.tasks[idx]={...existing.tasks[idx],...snapTask};
  else existing.tasks.push(snapTask);
  existing.tasks.sort(compareRoutineTasks);
  if(existing.partial!==false)existing.partial=true;
  RDAYS[day]=existing;
  routineSnapshotDirty=true;
};
const flushRoutineSnapshotChanges=()=>{
  if(!routineSnapshotDirty)return false;
  localSave();
  routineSnapshotDirty=false;
  return true;
};
const earliestRoutineDayKey=()=>{
  const days=[];
  Object.keys(RDATA||{}).forEach(k=>{const d=normalizeDayKey(k);if(d)days.push(d);});
  Object.keys(RDAYS||{}).forEach(k=>{const d=normalizeDayKey(k);if(d)days.push(d);});
  (RTASKS||[]).forEach(t=>{const d=normalizeDayKey(t&&t.createdAt);if(d)days.push(d);});
  days.sort();
  return days[0]||"";
};
const syncRoutineSnapshotsForTask=task=>{
  if(!task||!task.id)return false;
  const snap=routineTaskSnapshot(task);
  if(!snap)return false;
  let changed=false;
  Object.entries(RDAYS||{}).forEach(([day,daySnap])=>{
    if(!daySnap||!Array.isArray(daySnap.tasks))return;
    const idx=daySnap.tasks.findIndex(t=>String(t.id)===String(snap.id));
    if(idx<0)return;
    daySnap.tasks[idx]={...daySnap.tasks[idx],...snap};
    daySnap.tasks.sort(compareRoutineTasks);
    changed=true;
  });
  if(changed)routineSnapshotDirty=true;
  return changed;
};
const syncRoutineSnapshotsToDefinitions=()=>{
  const tasks=Array.isArray(RTASKS)?RTASKS:[];
  if(!tasks.length)return false;
  const touchedDays=new Set();
  tasks.forEach(task=>{
    const snap=routineTaskSnapshot(task);
    if(!snap)return;
    Object.entries(RDAYS||{}).forEach(([day,daySnap])=>{
      if(!daySnap||!Array.isArray(daySnap.tasks))return;
      const idx=daySnap.tasks.findIndex(t=>String(t.id)===String(snap.id));
      if(idx<0)return;
      daySnap.tasks[idx]={...daySnap.tasks[idx],...snap};
      touchedDays.add(day);
    });
  });
  if(!touchedDays.size)return false;
  touchedDays.forEach(day=>{
    const daySnap=RDAYS[day];
    if(daySnap&&Array.isArray(daySnap.tasks))daySnap.tasks.sort(compareRoutineTasks);
  });
  routineSnapshotDirty=true;
  return true;
};
const upgradePartialRoutineSnapshots=()=>{
  let changed=false;
  Object.entries(RDAYS||{}).forEach(([day,snap])=>{
    if(isRoutineSnapshotPartial(day,snap)){
      const upgraded=ensureRoutineDaySnapshot(day,{force:true});
      if(upgraded)changed=true;
    }
  });
  return changed;
};
const ensureRoutineSnapshotsUpToToday=()=>{
  const today=todayKey();
  const end=prevDayKey(today);
  if(!end)return false;
  let start=normalizeDayKey(RMETA.lastSnapshotDay);
  if(start)start=nextDayKey(start);
  const earliest=earliestRoutineDayKey();
  if(!start)start=earliest;
  else if(earliest&&earliest<start)start=earliest;
  if(!start||start>end)return false;
  let changed=false;
  let day=start;
  while(day&&day<=end){
    const snap=ensureRoutineDaySnapshot(day);
    if(snap)changed=true;
    day=nextDayKey(day);
  }
  RMETA.lastSnapshotDay=end;
  return changed;
};
const primeRoutineHistory=({persist=false}={})=>{
  RMETA=normalizeRoutineMeta(RMETA);
  if(!RMETA.lastActiveDay)RMETA.lastActiveDay=todayKey();
  upgradePartialRoutineSnapshots();
  ensureRoutineSnapshotsUpToToday();
  syncRoutineSnapshotsToDefinitions();
  if(persist&&routineSnapshotDirty){
    localSave();
    routineSnapshotDirty=false;
  }
};
const maybeRollRoutineDay=()=>{
  const today=todayKey();
  const last=normalizeDayKey(RMETA.lastActiveDay);
  if(!last){
    RMETA.lastActiveDay=today;
    return false;
  }
  if(last===today)return false;
  RMETA.lastActiveDay=today;
  return ensureRoutineSnapshotsUpToToday();
};

// HEATMAP — GitHub-style, rolling WEEKS*7 days
// ════════════════════════════════════════════
const renderHeatmap=()=>{
  const wrap=document.getElementById("heatmap-wrap");wrap.innerHTML="";
  const today=new Date();
  const compactView=isCompactPhoneView();
  const heatmapTitle=document.getElementById("heatmap-title");
  if(heatmapTitle)heatmapTitle.textContent=compactView?"ROUTINE ADHERENCE STRIP":"Routine Adherence Grid";
  if(compactView){
    const DAYS=11;
    const GAP=4;
    const containerW=wrap.clientWidth||300;
    const rawCell=Math.floor((containerW-(DAYS - 1) * GAP)/DAYS);
    const cellSize=Math.max(13,Math.min(26,rawCell));
    wrap.style.setProperty("--hmap-cell",cellSize+"px");
    wrap.style.setProperty("--hmap-gap",GAP+"px");
    const row=document.createElement("div");
    row.className="hmap-compact-row";
    row.style.gridTemplateColumns=`repeat(${DAYS},var(--hmap-cell))`;
    row.style.columnGap=`${GAP}px`;
    const compactDates=[];
    for(let i=DAYS-1;i>=0;i--){
      const date=new Date(today);
      date.setDate(today.getDate()-i);
      compactDates.push(new Date(date));
      const cell=document.createElement("div");cell.className="hc";
      const k=dKey(date);const isToday=k===todayKey();const isSel=k===_selDay;
      const p=pct(k);const col=cellBg(p);
      cell.style.background=col?col.bg:"var(--bg3)";
      cell.title=fmtDate(k)+(p?" · "+p+"%":"");
      cell.onclick=()=>{_selDay=k;renderHeatmap();renderTasks(k);};
      if(isToday)cell.classList.add("today");
      if(isSel)cell.classList.add("selected");
      row.appendChild(cell);
    }
    wrap.appendChild(row);
    const dayPercentages=[];const d=new Date(today);
    for(let i=0;i<DAYS;i++){dayPercentages.push(pct(dKey(d)));d.setDate(d.getDate()-1);}
    const filled=dayPercentages.filter(p=>p>0);
    document.getElementById("prog-sub").textContent=filled.length?Math.round(filled.reduce((a,b)=>a+b,0)/filled.length)+`% avg (${DAYS}d)`:"";
    flushRoutineSnapshotChanges();
    return;
  }
  // End on end of current week (Saturday)
  const endOfWeek=new Date(today);endOfWeek.setDate(today.getDate()+(6-today.getDay()));
  // Start WEEKS*7 days before end
  const start=new Date(endOfWeek);start.setDate(endOfWeek.getDate()-(WEEKS*7-1));

  // Compute cell size to fill container: containerWidth = dowWidth + gap + WEEKS*cell + (WEEKS-1)*gap
  const DOW_W=18,GAP=2;
  const containerW=wrap.clientWidth||300;
  const rawCell=Math.floor((containerW-DOW_W-GAP-(WEEKS-1)*GAP)/WEEKS);
  const cellSize=Math.max(8,Math.min(18,rawCell));
  // Override --hmap-cell locally on wrap element
  wrap.style.setProperty("--hmap-cell",cellSize+"px");

  // Build week columns
  const weeks=[];
  let cur=new Date(start);
  for(let w=0;w<WEEKS;w++){
    const week=[];
    for(let d=0;d<7;d++){week.push(new Date(cur));cur.setDate(cur.getDate()+1);}
    weeks.push(week);
  }

  // Month labels — one per first occurrence of month in a column
  const mlRow=document.createElement("div");
  mlRow.className="hmap-month-row";
  mlRow.style.gridTemplateColumns=`repeat(${WEEKS},var(--hmap-cell))`;
  let lastM=-1;
  weeks.forEach((week)=>{
    const lbl=document.createElement("div");lbl.style.cssText="font-size:9px;color:var(--fg3);overflow:hidden;white-space:nowrap;";
    const m=week[0].getMonth();
    lbl.textContent=(m!==lastM)?MSHORT[m]:"";
    if(m!==lastM)lastM=m;
    mlRow.appendChild(lbl);
  });
  wrap.appendChild(mlRow);

  // Body: dow labels + week columns
  const body=document.createElement("div");body.className="hmap-body";

  // DOW labels — M W F only, aligned per row
  const dowCol=document.createElement("div");dowCol.className="hmap-dow-col";
  // 7 rows: S M T W T F S
  ["","M","","W","","F",""].forEach(lbl=>{
    const el=document.createElement("div");el.className="hmap-dow-lbl";el.textContent=lbl;
    dowCol.appendChild(el);
  });
  body.appendChild(dowCol);

  // Columns wrap
  const colsWrap=document.createElement("div");colsWrap.className="hmap-cols-wrap";
  colsWrap.style.gridTemplateColumns=`repeat(${WEEKS},var(--hmap-cell))`;

  weeks.forEach(week=>{
    const wcol=document.createElement("div");wcol.className="hmap-week-col";
    week.forEach(date=>{
      const cell=document.createElement("div");cell.className="hc";
      const k=dKey(date);const isFuture=date>today;const isToday=k===todayKey();const isSel=k===_selDay;
      const p=pct(k);const col=cellBg(p);
      // Future dates: faint outline, very transparent
      if(isFuture){cell.style.cssText="background:transparent;opacity:0.12;border-color:var(--b);cursor:default;";}
      else{
        cell.style.background=col?col.bg:"var(--bg3)";
        cell.title=fmtDate(k)+(p?" · "+p+"%":"");
        cell.onclick=()=>{_selDay=k;renderHeatmap();renderTasks(k);};
        if(isToday)cell.classList.add("today");
        if(isSel)cell.classList.add("selected");
      }
      wcol.appendChild(cell);
    });
    colsWrap.appendChild(wcol);
  });
  body.appendChild(colsWrap);
  wrap.appendChild(body);

  // Stats
  const m30=[];const d=new Date(today);
  for(let i=0;i<30;i++){m30.push(pct(dKey(d)));d.setDate(d.getDate()-1);}
  const filled=m30.filter(p=>p>0);
  document.getElementById("prog-sub").textContent=filled.length?Math.round(filled.reduce((a,b)=>a+b,0)/filled.length)+"% avg (30d)":"";
  flushRoutineSnapshotChanges();
};

    phase:task.phase,
    block:String(task.block||"").trim(),
    order:Number.isFinite(Number(task.order))?Number(task.order):RTASKS.findIndex(t=>t.id===task.id),
    active:!task.hibernatedAt&&!task.deletedAt,
    createdAt:normalizeDayKey(task.createdAt)||todayKey(),

    ...(task.aliases&&task.aliases.length?{aliases:normalizeRoutineAliases(task.aliases)}:{}),
    ...(task.schedule?{schedule:normalizeRoutineSchedule(task.schedule)}:{}),
    ...(task.subs&&task.subs.length?{subs:normalizeRoutineSubs(task.subs)}:{}),

const syncRoutineDefinitionToCloud=task=>{
  if(!Cloud.enabled||!task||!task.id)return;
  Cloud.upsert(routineTaskDefinitionPayload(task))
    .then(res=>{if(!res?.ok)console.warn("Routine definition sync failed",res?.error||res);})
    .catch(err=>console.warn("Routine definition sync error",err));
};
const syncRoutineHistoryToCloud=(task,dateKey,status)=>{
  if(!Cloud.enabled||!task||!task.id)return;
  const day=normalizeDayKey(dateKey)||todayKey();
  Cloud.upsert({
    type:"routineHistory",
    name:routineTaskCloudName(task),
    status:!!status,
    date:day,
    clientKey:mkClientKey("routineHistory",routineTaskCloudName(task),day,null,task.id),
    data:{kind:"history",id:task.id,snapshot:routineTaskSnapshot(task)}

    .then(res=>{if(!res?.ok)console.warn("Routine history sync failed",res?.error||res);})

const renderTasks=k=>{
  if(!k)k=_selDay;
  const dayKey=normalizeDayKey(k)||k;
  _selDay=dayKey;
  const today=todayKey();
  if(dayKey&&dayKey<today){
    const hadSnap=!!(RDAYS[dayKey]&&Array.isArray(RDAYS[dayKey].tasks)&&RDAYS[dayKey].tasks.length);
    const snap=ensureRoutineDaySnapshot(dayKey);
    if(!hadSnap&&snap)save();
  }
  const list=document.getElementById("task-list");list.innerHTML="";
  const dd=RDATA[dayKey]||{},pool=getTasksForDay(dayKey),done=pool.filter(t=>dd[t.id]).length;
  const p=pool.length?Math.round(done/pool.length*100):0;
  const pts=dayKey.split("-");
  document.getElementById("sel-date").textContent=parseInt(pts[2])+" "+MSHORT[parseInt(pts[1])-1]+" "+pts[0];
  document.getElementById("sel-count").textContent=done+" of "+pool.length+" tasks";
  document.getElementById("pb").style.width=p+"%";
  PHASES.forEach(phase=>{
    const pt=pool.filter(t=>t.phase===phase).sort(compareRoutineTasks);
    if(!pt.length)return;
    const pd=document.createElement("div");pd.className="phase-block";
    const pl=document.createElement("div");pl.className="phase-lbl";pl.textContent=phase;pd.appendChild(pl);
    const blocks={};pt.forEach(t=>{if(!blocks[t.block])blocks[t.block]=[];blocks[t.block].push(t);});
    Object.entries(blocks).forEach(([blk,tasks])=>{
      const bl=document.createElement("div");bl.className="blk-lbl";bl.textContent=blk;pd.appendChild(bl);
      tasks.forEach(task=>{
        const ck=!!(dd[task.id]);
        const row=document.createElement("div");row.className="task-row";row.dataset.taskId=task.id;
        const main=document.createElement("div");main.className="task-main";
        const btn=document.createElement("button");btn.className="task-btn"+(ck?" ck":"");
        const cb=document.createElement("div");cb.className="cbx"+(ck?" ck":"");cb.textContent=ck?"✓":"";
        const nm=document.createElement("span");nm.className="tname";nm.textContent=task.name;
        btn.appendChild(cb);btn.appendChild(nm);
        btn.onclick=()=>{
          const wasChecked=!!(RDATA[dayKey]&&RDATA[dayKey][task.id]);
          if(!RDAYS[dayKey])ensureRoutineDaySnapshot(dayKey);
          if(!RDATA[dayKey])RDATA[dayKey]={};
          RDATA[dayKey][task.id]=!RDATA[dayKey][task.id];
          if(!wasChecked)_lastTickedId=task.id;// only auto-scroll when checking ON
          renderHeatmap();renderTasks(dayKey);updateHdr();
          save();// fire and forget — UI already updated
          const defTask=RTASKS.find(t=>t.id===task.id);
          if(defTask)syncRoutineDefinitionToCloud(defTask);
          syncRoutineHistoryToCloud(defTask||task,dayKey,!!RDATA[dayKey][task.id]);
        };
        main.appendChild(btn);
        if(task.subs&&task.subs.length){
          const sd=document.createElement("div");sd.className="sub-list";
          task.subs.forEach(s=>{const si=document.createElement("div");si.className="sub-item";si.textContent="– "+s;sd.appendChild(si);});
          const tog=document.createElement("button");tog.className="sub-tog";tog.textContent="▸";
          tog.onclick=()=>{const o=sd.classList.toggle("open");tog.textContent=o?"▾":"▸";};
          main.appendChild(tog);row.appendChild(main);row.appendChild(sd);
        }else row.appendChild(main);
        pd.appendChild(row);
      });
    });
    list.appendChild(pd);
  });

  if(!list.children.length){
    const empty=document.createElement("div");
    empty.className="td-empty";
    empty.style.padding="12px 0";
    empty.textContent="No routine tasks for this day.";
    const addBtn=document.createElement("button");
    addBtn.className="add-btn-g";
    addBtn.style.marginTop="8px";
    addBtn.textContent="+ Add routine task";
    addBtn.onclick=()=>{
      if(!edMode)document.getElementById("edit-toggle").click();
      else switchTab("active");
      setTimeout(()=>{
        const firstInp=document.querySelector("#editor-body .add-inp");
        if(firstInp)firstInp.focus();
      },30);
    };
    const wrap=document.createElement("div");
    wrap.style.cssText="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;";
    wrap.appendChild(empty);
    wrap.appendChild(addBtn);
    list.appendChild(wrap);
  }

  // Auto-scroll to ticked/unticked item
  if(_lastTickedId){
    const container=document.getElementById("routine-scroll");
    const tickedRow=list.querySelector(`[data-task-id="${_lastTickedId}"]`);
    if(tickedRow&&container){
      requestAnimationFrame(()=>{
        const cr=container.getBoundingClientRect();
        const rr=tickedRow.getBoundingClientRect();
        const offset=rr.top-cr.top+container.scrollTop-20;// 20px breathing room above item
        container.scrollTo({top:Math.max(0,offset),behavior:"smooth"});
      });
    }
    _lastTickedId=null;
  }
  flushRoutineSnapshotChanges();
};

// ════════════════════════════════════════════
// TO-DO — manual reorder (drag handle), newest at top when no order set
// ════════════════════════════════════════════
const normalizeTodoOrder=()=>{
  // Assign order to any todo missing it, preserving existing relative positions
  let nextOrder=TODOS.filter(t=>!t.done).reduce((m,t)=>t.order!==undefined&&t.order>m?t.order:m,-1)+1;
  TODOS.forEach(t=>{if(!t.done&&t.order===undefined)t.order=nextOrder++;});
};
const todoCloudPayload=(todo,{deleted=false}={})=>{
  const t=todo||{};
  const createdAt=t.createdAt||todayISO();
  const text=String(t.text||"").trim();
  return{
    type:"dailyTask",
    name:text,
    status:!!t.done,
    date:createdAt,
    clientKey:mkClientKey("dailyTask",text,createdAt),
    data:{
      id:t.id,
      order:t.order||0,
      indent:t.indent||0,
      deleted:!!deleted
    }
  };
};
const syncTodoToCloud=todo=>{
  if(!Cloud.enabled||!todo)return;
  const text=String(todo.text||"").trim();
  if(!text)return;
  Cloud.upsert(todoCloudPayload(todo,{deleted:false}))
    .then(res=>{if(!res?.ok)console.warn("Todo cloud sync failed",res?.error||res);})
    .catch(err=>console.warn("Todo cloud sync error",err));
};
const tombstoneTodoInCloud=todo=>{
  if(!Cloud.enabled||!todo)return;
  const text=String(todo.text||"").trim();
  if(!text)return;
  Cloud.upsert(todoCloudPayload(todo,{deleted:true}))
    .then(res=>{if(!res?.ok)console.warn("Todo delete tombstone sync failed",res?.error||res);})
    .catch(err=>console.warn("Todo delete tombstone sync error",err));
};
const renderTodos=()=>{
  normalizeTodoOrder();
  const activeAll=TODOS.filter(t=>!t.done).sort((a,b)=>(a.order||0)-(b.order||0));
  const compactView=isCompactPhoneView();
  const active=compactView?activeAll.slice(0,COMPACT_TODO_VISIBLE_LIMIT):activeAll;
  const done=TODOS.filter(t=>t.done).sort((a,b)=>(b.completedAt||"").localeCompare(a.completedAt||""));
  let tdCountText="all done ✓";
  if(activeAll.length){
    tdCountText=`${activeAll.length} remaining`;
    if(compactView&&activeAll.length>active.length)tdCountText=`${active.length} of ${activeAll.length} shown`;
  }
  document.getElementById("td-count").textContent=tdCountText;
  document.getElementById("td-done-label").textContent="Done ("+done.length+")";
  const al=document.getElementById("td-active");al.innerHTML="";
  if(!active.length){const e=document.createElement("div");e.className="td-empty";e.textContent="Nothing to do.";al.appendChild(e);}
  else active.forEach(td=>al.appendChild(makeTd(td,false)));
  const dl=document.getElementById("td-done");dl.innerHTML="";
  done.forEach(td=>dl.appendChild(makeTd(td,true)));
};
const makeTd=(td,isDone)=>{
  const el=document.createElement("div");el.className="td-item";el.dataset.id=td.id;
  // Indent
  if(td.indent>0){const iw=document.createElement("div");iw.className="td-indent-wrap";for(let i=0;i<td.indent;i++){const b=document.createElement("div");b.className="td-indent-bar";iw.appendChild(b);}el.appendChild(iw);}
  // Drag-to-reorder handle (active items only)
  if(!isDone){
    const handle=document.createElement("span");handle.className="td-drag-handle";handle.textContent="⠿";handle.title="Drag to reorder";handle.setAttribute("aria-label","Drag to reorder");
    el.draggable=true;
    el.addEventListener("dragstart",e=>{todosDragId=td.id;el.classList.add("td-dragging");e.dataTransfer.effectAllowed="move";});
    el.addEventListener("dragend",()=>{el.classList.remove("td-dragging");document.querySelectorAll(".td-item").forEach(x=>x.classList.remove("td-drag-over"));todosDragId=null;});
    el.addEventListener("dragover",e=>{e.preventDefault();if(todosDragId&&todosDragId!==td.id){document.querySelectorAll(".td-item").forEach(x=>x.classList.remove("td-drag-over"));el.classList.add("td-drag-over");}});
    el.addEventListener("dragleave",()=>el.classList.remove("td-drag-over"));
    el.addEventListener("drop",e=>{
      e.preventDefault();el.classList.remove("td-drag-over");
      if(!todosDragId||todosDragId===td.id)return;
      normalizeTodoOrder();
      const active=TODOS.filter(t=>!t.done).sort((a,b)=>(a.order||0)-(b.order||0));
      const fi=active.findIndex(x=>x.id===todosDragId);
      if(fi<0)return;
      const srcIndent=active[fi].indent||0;
      let fe=fi+1;
      while(fe<active.length&&(active[fe].indent||0)>srcIndent)fe++;
      const block=active.slice(fi,fe);
      if(block.some(x=>x.id===td.id))return;
      active.splice(fi,fe-fi);
      const ti=active.findIndex(x=>x.id===td.id);
      if(ti<0)return;
      active.splice(ti,0,...block);
      active.forEach((t,i)=>{const j=TODOS.findIndex(x=>x.id===t.id);if(j>=0)TODOS[j].order=i;});
      renderTodos();save();
      active.forEach(t=>syncTodoToCloud(t));
    });
    el.appendChild(handle);
  }
  // Mobile swipe indent/unindent (active only)
  if(!isDone){
    let sx=null;
    el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
    el.addEventListener("touchmove",e=>{if(sx===null)return;const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>12){e.preventDefault();el.style.transform=`translateX(${Math.max(-45,Math.min(45,dx))*.55}px)`;el.classList.toggle("swiping-r",dx>15);el.classList.toggle("swiping-l",dx<-15);}},{passive:false});
    el.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;el.style.transform="";el.classList.remove("swiping-r","swiping-l");if(dx>55){const i=TODOS.findIndex(x=>x.id===td.id);if(i>=0&&(TODOS[i].indent||0)<2){TODOS[i].indent=(TODOS[i].indent||0)+1;renderTodos();save();syncTodoToCloud(TODOS[i]);}}else if(dx<-55){const i=TODOS.findIndex(x=>x.id===td.id);if(i>=0&&(TODOS[i].indent||0)>0){TODOS[i].indent=(TODOS[i].indent||0)-1;renderTodos();save();syncTodoToCloud(TODOS[i]);}}sx=null;});
  }
  const cb=document.createElement("div");cb.className="td-cb"+(td.done?" ck":"");cb.textContent=td.done?"✓":"";
  cb.onclick=()=>{const i=TODOS.findIndex(x=>x.id===td.id);if(i<0)return;TODOS[i].done=!TODOS[i].done;if(TODOS[i].done)TODOS[i].completedAt=todayKey();else delete TODOS[i].completedAt;renderTodos();save();syncTodoToCloud(TODOS[i]);};
  const txt=document.createElement("span");txt.className="td-text"+(td.done?" ck":"");txt.textContent=td.text;txt.onclick=()=>cb.onclick();
  const acts=document.createElement("div");acts.className="td-actions";
  if(!isDone){
    const indR=document.createElement("button");indR.className="td-btn";indR.textContent="⟶";indR.title="Move task right to indent";indR.setAttribute("aria-label","Move task right to indent");indR.onclick=()=>{const i=TODOS.findIndex(x=>x.id===td.id);if(i>=0&&(TODOS[i].indent||0)<2){TODOS[i].indent=(TODOS[i].indent||0)+1;renderTodos();save();syncTodoToCloud(TODOS[i]);}};
    const indL=document.createElement("button");indL.className="td-btn";indL.textContent="⟵";indL.title="Move task left to outdent";indL.setAttribute("aria-label","Move task left to outdent");indL.onclick=()=>{const i=TODOS.findIndex(x=>x.id===td.id);if(i>=0&&(TODOS[i].indent||0)>0){TODOS[i].indent=(TODOS[i].indent||0)-1;renderTodos();save();syncTodoToCloud(TODOS[i]);}};
    acts.appendChild(indL);acts.appendChild(indR);
  }
  const del=document.createElement("button");del.className="td-btn del";del.textContent="✕";del.onclick=()=>{const removed=TODOS.find(x=>x.id===td.id);TODOS=TODOS.filter(x=>x.id!==td.id);renderTodos();save();if(removed)tombstoneTodoInCloud(removed);};
  acts.appendChild(del);
  el.appendChild(cb);el.appendChild(txt);el.appendChild(acts);
  return el;
};
