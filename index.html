const EXPANDED_TIMER_DAYS_TO_SHOW=7;
const COMPACT_TIMER_DAYS_TO_SHOW=3;
const getWeekDays=(daysToShow=EXPANDED_TIMER_DAYS_TO_SHOW)=>{
  const today=new Date();
  const days=[];
  for(let daysAgo=daysToShow-1;daysAgo>=0;daysAgo--){
    const dayDate=new Date(today);
    dayDate.setDate(today.getDate()-daysAgo);
    days.push(dKey(dayDate));
  }
  return days;
};
const getDayMins=ds=>(FOCUS.sessions||[]).filter(s=>s.date===ds).reduce((sum,s)=>sum+(s.duration||0),0);

const renderWeekly=()=>{
  const grid=document.getElementById("tw-grid");grid.innerHTML="";
  const isMobileLayout=window.matchMedia(`(max-width:${GOALS_GRID_BREAKPOINT}px)`).matches;
  const days=getWeekDays(isMobileLayout?EXPANDED_TIMER_DAYS_TO_SHOW:COMPACT_TIMER_DAYS_TO_SHOW);const TARGET=6*60;
  days.forEach(ds=>{
    const mins=getDayMins(ds);const p=Math.min(100,Math.round(mins/TARGET*100));
    const d2=new Date(ds+"T00:00:00");
    const cell=document.createElement("div");cell.className="tw-day";
    const l=document.createElement("span");l.className="tw-lbl";l.textContent=DLBL[d2.getDay()];
    const bw=document.createElement("div");bw.className="tw-bar-wrap";
    const bf=document.createElement("div");bf.className="tw-bar-fill";bf.style.height=p+"%";bf.style.opacity=0.2+p/100*0.8;
    bw.appendChild(bf);
    const h=document.createElement("span");h.className="tw-hrs";h.textContent=mins>=60?Math.floor(mins/60)+"h":mins?mins+"m":"";
    bw.appendChild(l);
    cell.appendChild(bw);cell.appendChild(h);grid.appendChild(cell);
  });
};

const fmtMM=secs=>{const m=Math.floor(secs/60),s=secs%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};

// Build ordered array of phases from user settings
const computePlan=()=>{
  const fSec=tFocusMins*60,bSec=tBrkMins*60,sessSec=tSessMins*60;
  const plan=[];let rem=sessSec;
  while(rem>0){
    const fDur=Math.min(fSec,rem);plan.push({type:"focus",dur:fDur});rem-=fDur;
    if(rem>0&&bSec>0){const bDur=Math.min(bSec,rem);plan.push({type:"brk",dur:bDur});rem-=bDur;}
  }
  return plan;
};

const updateTimerUI=()=>{
  const disp=document.getElementById("timer-disp");
  const phRow=document.getElementById("timer-phase-row");
  const sessBar=document.getElementById("timer-sess-bar");
  const sessFill=document.getElementById("timer-sess-fill");
  const planEl=document.getElementById("timer-plan");
  if(!tRunning&&!tPaused){
    disp.textContent=tSessMins>0?fmtMM(tSessMins*60):"00:00";
    disp.className="timer-disp";phRow.innerHTML="";sessFill.style.width="0%";sessBar.style.visibility="hidden";sessBar.style.opacity="0";
    const plan=computePlan();
    const focuses=plan.filter(p=>p.type==="focus").length;
    const brks=plan.filter(p=>p.type==="brk").length;
    planEl.textContent=tSessMins?(focuses+" focus block"+(focuses!==1?"s":"")+(brks?" · "+brks+" break"+(brks!==1?"s":""):"")):"";
    return;
  }
  const phaseRem=Math.max(0,tPhaseDur-tPhaseElapsed);
  disp.textContent=fmtMM(phaseRem);
  disp.className="timer-disp "+(tPhase==="focus"?"running-focus":"running-brk");
  const sessPct=Math.min(100,Math.round(tSessElapsed/(tSessMins*60)*100));
  sessBar.style.visibility="visible";sessBar.style.opacity="1";sessFill.style.width=sessPct+"%";
  const totalFocuses=tPlan.filter(p=>p.type==="focus").length;
  const totalBreaks=tPlan.filter(p=>p.type==="brk").length;
  const currentFocus=tPlan.slice(0,tPlanIdx+1).filter(p=>p.type==="focus").length;
  const currentBreak=tPlan.slice(0,tPlanIdx+1).filter(p=>p.type==="brk").length;
  // A break phase is only rendered while running a break, so keep denominator readable even for edge configs.
  const displayBreakTotal=Math.max(totalBreaks,1);
  phRow.innerHTML="";
  planEl.textContent=tPhase==="focus"
    ?`Focus block ${currentFocus}/${totalFocuses}`
    :`Break block ${currentBreak}/${displayBreakTotal}`;
};

const resetTimer=()=>{
  clearInterval(tInt);tInt=null;tRunning=false;tPaused=false;
  tPhase="focus";tCycle=0;tPhaseElapsed=0;tSessElapsed=0;tFocusSecs=0;
  tPlan=[];tPlanIdx=0;tPhaseDur=0;
  const startBtn=document.getElementById("timer-start");
  startBtn.textContent="Start";startBtn.className="tbtn start";startBtn.style.display="";
  document.getElementById("timer-stop").style.display="none";
  document.getElementById("timer-log-inline-btn").style.display="none";
  document.getElementById("timer-skip-btn").style.display="none";
  updateTimerUI();
};

const sessionDone=()=>{
  clearInterval(tInt);tInt=null;tRunning=false;
  playSessionEndCue();
  document.getElementById("timer-disp").textContent="Done!";
  document.getElementById("timer-disp").className="timer-disp done";
  document.getElementById("timer-start").style.display="none";
  document.getElementById("timer-stop").style.display="none";
  document.getElementById("timer-log-inline-btn").style.display="";
  document.getElementById("timer-skip-btn").style.display="";
  document.getElementById("timer-sess-fill").style.width="100%";
  document.getElementById("timer-phase-row").innerHTML="";
  document.getElementById("timer-plan").textContent="Session complete";
};

const tick=()=>{
  tPhaseElapsed++;tSessElapsed++;
  if(tPhase==="focus")tFocusSecs++;
  if(tSessElapsed>=tSessMins*60){sessionDone();return;}
  if(tPhaseElapsed>=tPhaseDur){
    tPhaseElapsed=0;tPlanIdx++;
    if(tPlanIdx>=tPlan.length){sessionDone();return;}
    const next=tPlan[tPlanIdx];
    tPhase=next.type;tPhaseDur=next.dur;
    if(tPhase==="brk")tCycle++;
    if(tPhase==="focus"){
      const focusBlocksStarted=tPlan.slice(0,tPlanIdx+1).filter(p=>p.type==="focus").length;
      if(focusBlocksStarted>1)playFocusStartCue();
    }
  }
  updateTimerUI();
};

const startTimer=()=>{
  unlockTimerAudio();
  tPlan=computePlan();if(!tPlan.length)return;
  tPlanIdx=0;tPhase=tPlan[0].type;tPhaseDur=tPlan[0].dur;
  tPhaseElapsed=0;tSessElapsed=0;tFocusSecs=0;tCycle=0;
  tRunning=true;tPaused=false;
  const startBtn=document.getElementById("timer-start");
  startBtn.textContent="Pause";startBtn.className="tbtn pause";startBtn.style.display="";
  document.getElementById("timer-stop").style.display="";
  tInt=setInterval(tick,1000);updateTimerUI();
};

const pauseTimer=()=>{
  if(tPaused){tPaused=false;document.getElementById("timer-start").textContent="Pause";tInt=setInterval(tick,1000);}
  else{tPaused=true;clearInterval(tInt);tInt=null;document.getElementById("timer-start").textContent="Resume";}
};

document.getElementById("timer-start").onclick=()=>{if(!tRunning)startTimer();else pauseTimer();};
document.getElementById("timer-stop").onclick=()=>{
  clearInterval(tInt);tInt=null;tRunning=false;tPaused=false;
  if(tFocusSecs>=30){
    document.getElementById("timer-start").style.display="none";
    document.getElementById("timer-stop").style.display="none";
    document.getElementById("timer-log-inline-btn").style.display="";
    document.getElementById("timer-skip-btn").style.display="";
    document.getElementById("timer-phase-row").innerHTML="";
    document.getElementById("timer-disp").className="timer-disp";
  }else{resetTimer();}
};
const logFocusSession=async()=>{
  const dur=Math.max(1,Math.round(tFocusSecs/60));
  const session={id:genId(),date:todayKey(),duration:dur,note:"",cycles:tCycle+1,createdAt:todayISO()};
  FOCUS.sessions.push(session);
  const breakCount=tCycle;
  const breakText=breakCount>0?`, ${breakCount} break${breakCount===1?"":"s"}`:"";
  await save();renderWeekly();resetTimer();showToast(`Logged: ${dur}min${breakText}`);
  if(window.Cloud&&window.Cloud.enabled){window.Cloud.upsert({type:"focusSession",name:"Focus Session "+session.date,status:true,clientKey:`focus:${session.id}`,date:session.date,data:{id:session.id,duration:session.duration,note:session.note,cycles:session.cycles,createdAt:session.createdAt}});}
};

const initMobileQuoteDrag=()=>{
  const q=document.getElementById("daily-quote-mobile");
  if(!q||q.dataset.dragReady==="1")return;
  q.dataset.dragReady="1";
  let sx=0,sy=0,dx=0,dy=0,dragging=false;
  const apply=()=>{q.style.transform=`translate(${dx}px, ${dy}px)`;};
  q.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch")return;
    dragging=true;
    sx=e.clientX-dx;
    sy=e.clientY-dy;
    q.style.transition="none";
    q.setPointerCapture(e.pointerId);
  });
  q.addEventListener("pointermove",e=>{
    if(!dragging||e.pointerType!=="touch")return;
    dx=Math.max(-34,Math.min(34,e.clientX-sx));
    dy=Math.max(-18,Math.min(18,e.clientY-sy));
    apply();
  });
  const release=e=>{
    if(!dragging||e.pointerType!=="touch")return;
    dragging=false;
    q.style.transition="transform .28s ease-out";
    dx=0;
    dy=0;
    apply();
  };
  q.addEventListener("pointerup",release);
  q.addEventListener("pointercancel",release);
};

const parseSessionMins=txt=>{
  const v=(txt||"").trim().toLowerCase();
  if(!v)return null;
  if(/^\d+$/.test(v))return parseInt(v,10);
  const hhmm=v.match(/^(\d+):([0-5]?\d)$/);
  if(hhmm)return parseInt(hhmm[1],10)*60+parseInt(hhmm[2],10);
  const h=v.match(/^(\d+)\s*h(?:\s*(\d+)\s*m?)?$/);
  if(h)return parseInt(h[1],10)*60+parseInt(h[2]||"0",10);
  const m=v.match(/^(\d+)\s*m$/);
  if(m)return parseInt(m[1],10);
  return null;
};

const makeRing=(p,size,color,label)=>{const r2=size*.44,cx=size/2,cy=size/2,c=2*Math.PI*r2,d=p/100*c,t=String(label||(`${p}%`));return`<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="var(--bg4)" stroke-width="${(size*.08).toFixed(1)}"/><circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="${color||"var(--green)"}" stroke-width="${(size*.08).toFixed(1)}" stroke-dasharray="${d.toFixed(1)} ${(c-d).toFixed(1)}" stroke-dashoffset="${(c*.25).toFixed(1)}" stroke-linecap="round"/><text x="${cx}" y="${(cy+size*.075).toFixed(1)}" text-anchor="middle" font-size="${(size*.2).toFixed(1)}" fill="var(--fg3)" font-family="inherit">${t}</text></svg>`;};

let progressPopGoalId=null;
const goalCloudSyncTimers=new Map();
const GOAL_REORDER_SYNC_DELAY_MS=200;
const GOAL_CALENDAR_SYNC_DELAY_MS=450;
const GOAL_OVERLAY_SYNC_DELAY_MS=100;
const syncGoalToCloud=(goal,status=true)=>{
  if(!(window.Cloud&&window.Cloud.enabled)||!goal)return;
  const name=String(goal.name||"").trim()||"Untitled goal";
  const wk=weekKey();
  window.Cloud.upsert({
    type:"mainGoal",
    name,
    status:!!status,
    week:wk,
    clientKey:mkClientKey("mainGoal",name,undefined,wk,goal.id),
    data:{
      id:goal.id,
      emoji:goal.emoji||"",
      desc:goal.desc||"",
      calendar:normalizeGoalCalendarRows(goal.calendar||[]),
      color:goal.color||"default",
      progress:goal.progress||0,
      order:goal.order||0
    }
  });
};
const queueGoalCloudSync=(goalId,delay=GOAL_CALENDAR_SYNC_DELAY_MS)=>{
  if(!(window.Cloud&&window.Cloud.enabled)||!goalId)return;
  const key=String(goalId);
  const prev=goalCloudSyncTimers.get(key);
  if(prev)clearTimeout(prev);
  const timer=setTimeout(()=>{
    goalCloudSyncTimers.delete(key);
    const goal=GOALS.find(g=>g.id===goalId);
    if(goal)syncGoalToCloud(goal,true);
  },Math.max(0,delay));
  goalCloudSyncTimers.set(key,timer);
};
const showProgressPop=(id,ringEl)=>{
  const existing=document.getElementById("goal-prog-pop");
  if(existing){existing.remove();if(progressPopGoalId===id){progressPopGoalId=null;return;}}
  progressPopGoalId=id;
  const goal=GOALS.find(g=>g.id===id);if(!goal)return;
  const pop=document.createElement("div");pop.id="goal-prog-pop";pop.className="goal-prog-pop";
  const r=ringEl.getBoundingClientRect();
  pop.style.left=r.left+"px";pop.style.top=(r.bottom+6)+"px";
  pop.innerHTML=`<div class="goal-prog-pop-lbl">Progress</div><div class="goal-prog-pop-row"><input type="range" class="goal-prog-pop-range" id="gpop-range" min="0" max="100" value="${goal.progress||0}"><span class="goal-prog-pop-pct" id="gpop-pct">${goal.progress||0}%</span></div><button class="goal-prog-pop-btn" id="gpop-set">Set</button>`;
  document.body.appendChild(pop);
  pop.querySelector("#gpop-range").oninput=function(){pop.querySelector("#gpop-pct").textContent=this.value+"%";};
  pop.querySelector("#gpop-set").onclick=e=>{
    e.stopPropagation();
    const g=GOALS.find(x=>x.id===progressPopGoalId);
    if(g){
      g.progress=parseInt(pop.querySelector("#gpop-range").value)||0;
      save();
      syncGoalToCloud(g,true);
    }
    pop.remove();progressPopGoalId=null;renderGoals();
  };
  setTimeout(()=>{
    const handler=e=>{if(!pop.contains(e.target)){pop.remove();progressPopGoalId=null;document.removeEventListener("click",handler);}};
    document.addEventListener("click",handler);
  },0);
};
const escapeHtml=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const renderGoalTileDailyList=(goal,dateKey=todayKey())=>{
  const row=goalRowByDate(goal,dateKey);
  if(!row)return `<div class="goal-daily-empty">No pending goals for today.</div>`;
  const daily=(row.dailyGoals||[]).map((item,idx)=>({...item,kind:"daily",idx})).filter(item=>!item.done);
  const weeklyText=String((row.mainGoal??row.weeklyGoal)||"").trim();
  const weeklyDone=!!(row.mainDone??row.weeklyDone);
  const weekly=(isSundayKey(dateKey)&&weeklyText&&!weeklyDone)?[{kind:"weekly",text:weeklyText}]:[];
  const remaining=[...daily,...weekly];
  if(!remaining.length)return `<div class="goal-daily-empty">No pending goals for today.</div>`;
  return remaining.slice(0,GOAL_TILE_DAILY_LIMIT).map(item=>{
    if(item.kind==="weekly")return `<label class="goal-daily-item"><input type="checkbox" data-goal-id="${goal.id}" data-goal-date="${dateKey}" data-goal-kind="main"><span>Main: ${escapeHtml(item.text)}</span></label>`;
    return `<label class="goal-daily-item"><input type="checkbox" data-goal-id="${goal.id}" data-goal-date="${dateKey}" data-goal-kind="daily" data-goal-idx="${item.idx}"><span>${escapeHtml(item.text)}</span></label>`;
  }).join("");
};
const setGoalDailyDone=(goalId,dateKey,kind,goalIdx,done)=>{
  const goal=GOALS.find(g=>g.id===goalId);if(!goal)return;
  const row=goalRowByDate(goal,dateKey);if(!row)return;
  if(kind==="weekly"||kind==="main"){
    row.mainDone=!!done;
    row.weeklyDone=!!done;
    save();
    syncGoalToCloud(goal,true);
    renderGoals();
    return;
  }
  const idx=Number(goalIdx);
  if(!Number.isInteger(idx)||idx<0||idx>=((row.dailyGoals||[]).length))return;
  row.dailyGoals[idx].done=!!done;
  save();
  syncGoalToCloud(goal,true);
  renderGoals();
};
const readGoalCalendarRowsFromDom=goal=>{
  const rows=[...document.querySelectorAll("#goal-calendar-body tr")];
  const prevByDate=new Map(((goal&&goal.calendar)||[]).map(r=>[r.date,r]));
  return rows.map(tr=>{
    const date=String((tr.querySelector(".goal-cal-date")||{}).value||"").trim();
    const prev=prevByDate.get(date)||{};
    const dailyGoals=[...tr.querySelectorAll(".goal-cal-task-row[data-kind='daily']")]
      .map(el=>{
        const id=String(el.dataset.taskId||"").trim();
        const text=String((el.querySelector(".goal-cal-task-txt")||{}).value||"").trim();
        const done=!!((el.querySelector(".goal-cal-task-done")||{}).checked);
        return{id,text,done};
      })
      .filter(item=>item.text);
    const mainGoal=String((tr.querySelector(".goal-cal-weekly")||{}).value||"").trim();
    const mainDone=!!((tr.querySelector(".goal-cal-weekly-done")||{}).checked);
    return{
      date,
      dailyGoals,
      mainGoal,
      mainDone:mainGoal?mainDone:false,
      weeklyGoal:mainGoal,
      weeklyDone:mainGoal?mainDone:false
    };
  });
};
const syncGoalCalendarRowsFromInputs=()=>{
  if(!currentGoalId)return;
  const goal=GOALS.find(g=>g.id===currentGoalId);if(!goal)return;
  goal.calendar=normalizeGoalCalendarRows(readGoalCalendarRowsFromDom(goal));

const addGoalCalendarRow=(goal,dateSeed=todayKey())=>{
  const rows=normalizeGoalCalendarRows(goal.calendar||[]);
  let next=parseYMD(dateSeed)||new Date();
  if(rows.length){
    const last=parseYMD(rows[rows.length-1].date);
    if(last){next=new Date(last);next.setDate(next.getDate()+1);}
  }
  rows.push({date:dKey(next),dailyGoals:[],mainGoal:"",mainDone:false,weeklyGoal:"",weeklyDone:false});
  goal.calendar=normalizeGoalCalendarRows(rows);
};
const applyGoalCalendarTaskToRange=()=>{
  if(!currentGoalId)return;
  const goal=GOALS.find(g=>g.id===currentGoalId);if(!goal)return;
  const startEl=document.getElementById("goal-cal-range-start");
  const endEl=document.getElementById("goal-cal-range-end");
  const taskEl=document.getElementById("goal-cal-range-task");
  const startKey=String((startEl&&startEl.value)||"").trim();
  const endKey=String((endEl&&endEl.value)||"").trim();
  const taskText=String((taskEl&&taskEl.value)||"").trim();
  if(!startKey||!endKey){showToast("Choose start and end dates");return;}
  if(!taskText){showToast("Enter a task for the range");return;}
  const start=parseYMD(startKey),end=parseYMD(endKey);
  if(!start||!end){showToast("Invalid date range");return;}
  if(start>end){showToast("Start date must be before end date");return;}
  const byDate=new Map(normalizeGoalCalendarRows(goal.calendar||[]).map(r=>[r.date,r]));
  const cursor=new Date(start);
  const maxDays=370;
  let added=0;
  for(let i=0;i<=maxDays&&cursor<=end;i++){
    const key=dKey(cursor);
    let row=byDate.get(key);
    if(!row){
      row={date:key,dailyGoals:[],mainGoal:"",mainDone:false,weeklyGoal:"",weeklyDone:false};
      byDate.set(key,row);
    }
    const tasks=Array.isArray(row.dailyGoals)?row.dailyGoals:[];
    const exists=tasks.some(t=>String((t&&t.text)||"").trim().toLowerCase()===taskText.toLowerCase());
    if(!exists){
      tasks.push({id:genId(),text:taskText,done:false});
      row.dailyGoals=tasks;
      added++;
    }
    cursor.setDate(cursor.getDate()+1);
  }
  goal.calendar=normalizeGoalCalendarRows([...byDate.values()]);
  save();
  syncGoalToCloud(goal,true);
  renderGoals();
  renderGoalCalendarEditor();
  showToast(added?`Added to ${added} day${added===1?"":"s"}`:"Task already exists in selected range");
};

};
const makeGoalTaskRowHtml=(task,kind="daily")=>{

      g.calendar=arr;

const renderGoals=()=>{
  normalizeGoals();
  const grid=document.getElementById("bento-grid");
  // Remove previous goal cards
  grid.querySelectorAll(".goal-bento-card,.goals-row,.goals-edit-row").forEach(el=>el.remove());
  const editRow=document.createElement("div");
  editRow.className="goals-edit-row";
  editRow.innerHTML=`<div class="goals-edit-line"></div><button class="goals-edit-btn${goalsEditMode?" on":""}" id="goals-edit-toggle">${goalsEditMode?"Done":"Edit goals"}</button>`;
  editRow.querySelector("#goals-edit-toggle").onclick=()=>{
    goalsEditMode=!goalsEditMode;
    renderGoals();
  };
  grid.appendChild(editRow);
  const row=document.createElement("div");
  row.className="goals-row";
  row.id="goals-row";
  GOALS.forEach(goal=>{
    const color=GOAL_COLORS[goal.color]||"var(--green)";
    const weekTarget=goalWeekTarget(goal,todayKey());
    const weekTargetDone=goalWeekTargetComplete(goal,todayKey());
    const todayStats=goalStatsForDate(goal,todayKey());
    const ringPct=todayStats.pct;
    const ringLabel=`${todayStats.done}/${todayStats.total}`;
    const dailyListHtml=goalsEditMode?"":`<div class="goal-daily-list">${renderGoalTileDailyList(goal)}</div>`;
    const card=document.createElement("div");
    card.className="bento-card goal-bento-card"+(goalsEditMode?" editing":"");
    card.dataset.id=goal.id;
    card.innerHTML=`<div class="goal-progress-ring">${makeRing(ringPct,34,"var(--green)",ringLabel)}</div><div class="goal-tile-emoji">${goal.emoji||""}</div><div class="goal-tile-name" style="color:${color}">${goal.name}</div><div class="goal-week-target">Week target: <b>${escapeHtml(weekTarget||"Not set")}</b>${weekTargetDone?'<span class="goal-week-target-done" aria-label="Weekly target complete">✓</span>':""}</div>${dailyListHtml}<div class="goal-card-edit-row"><button class="goal-edit-btn drag" title="Drag to reorder">⠿ Reorder</button><button class="goal-edit-btn del">Delete</button></div>`;
    const ringEl=card.querySelector(".goal-progress-ring");
    const dailyWrap=card.querySelector(".goal-daily-list");
    if(dailyWrap)dailyWrap.onclick=e=>e.stopPropagation();
    card.querySelectorAll(".goal-daily-item input[type=checkbox]").forEach(cb=>{
      cb.onchange=e=>{
        e.stopPropagation();
        setGoalDailyDone(cb.dataset.goalId,cb.dataset.goalDate,cb.dataset.goalKind,cb.dataset.goalIdx,cb.checked);
      };
    });
    if(!goalsEditMode){
      ringEl.onclick=e=>e.stopPropagation();
      ringEl.title=`Today progress: ${ringLabel}`;
      card.onclick=()=>openGoalOverlay(goal.id);
    }else{
      ringEl.style.pointerEvents="none";
      const delBtn=card.querySelector(".goal-edit-btn.del");
      delBtn.onclick=e=>{
        e.stopPropagation();
        const idx=GOALS.findIndex(x=>x.id===goal.id);
        if(idx<0)return;
        const removed=GOALS[idx];
        GOALS.splice(idx,1);
        GOALS.forEach((g,i)=>{g.order=i;});
        if(removed&&goalCloudSyncTimers.has(removed.id)){
          clearTimeout(goalCloudSyncTimers.get(removed.id));
          goalCloudSyncTimers.delete(removed.id);
        }
        if(removed)syncGoalToCloud(removed,false);
        renderGoals();
        save();
      };
      card.draggable=true;
      card.tabIndex=0;
      card.addEventListener("dragstart",e=>{goalDragId=goal.id;card.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
      card.addEventListener("dragend",()=>{card.classList.remove("dragging");document.querySelectorAll(".goal-bento-card").forEach(x=>x.classList.remove("drag-over"));goalDragId=null;});
      card.addEventListener("dragover",e=>{e.preventDefault();if(goalDragId&&goalDragId!==goal.id){card.classList.add("drag-over");}});
      card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));
      card.addEventListener("drop",e=>{
        e.preventDefault();
        card.classList.remove("drag-over");
        if(!goalDragId||goalDragId===goal.id)return;
        const arr=[...GOALS].sort((a,b)=>(a.order||0)-(b.order||0));
        const from=arr.findIndex(x=>x.id===goalDragId),to=arr.findIndex(x=>x.id===goal.id);
        if(from<0||to<0)return;
        const moved=arr.splice(from,1)[0];
        arr.splice(to,0,moved);
        arr.forEach((g,i)=>{g.order=i;});
        GOALS=arr;
        GOALS.forEach(g=>queueGoalCloudSync(g.id,GOAL_REORDER_SYNC_DELAY_MS));
        renderGoals();
        save();
      });
      card.addEventListener("keydown",e=>{
        if(!e.altKey)return;
        if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;
        e.preventDefault();
        const arr=[...GOALS].sort((a,b)=>(a.order||0)-(b.order||0));
        const idx=arr.findIndex(x=>x.id===goal.id);
        if(idx<0)return;
        const cols=window.matchMedia(`(max-width:${GOALS_GRID_BREAKPOINT}px)`).matches?GOALS_COLS_MOBILE:GOALS_COLS_DESKTOP;
        const delta=e.key==="ArrowLeft"?-1:e.key==="ArrowRight"?1:e.key==="ArrowUp"?-cols:cols;
        const target=Math.max(0,Math.min(arr.length-1,idx+delta));
        if(target===idx)return;
        const moved=arr.splice(idx,1)[0];
        arr.splice(target,0,moved);
        arr.forEach((g,i)=>{g.order=i;});
        GOALS=arr;
        GOALS.forEach(g=>queueGoalCloudSync(g.id,GOAL_REORDER_SYNC_DELAY_MS));
        renderGoals();
        save();
      });
    }
    row.appendChild(card);
  });
  if(goalsEditMode){
    const add=document.createElement("button");
    add.className="bento-card goal-bento-card goal-add-card";
    add.type="button";
    add.setAttribute("aria-label","Add goal");
    add.innerHTML=`<div>+<span>Add goal</span></div>`;
    add.onclick=()=>{
      const nextOrder=GOALS.length;
      const newGoal={id:genId(),emoji:"",name:nextGoalName(),desc:"",color:"default",progress:0,order:nextOrder};
      GOALS.push(newGoal);
      renderGoals();
      save();
      syncGoalToCloud(newGoal,true);
    };
    row.appendChild(add);
  }
  grid.appendChild(row);
};

const syncNoteToCloud=note=>{

  window.Cloud.upsert({type:"note",name:note.title||"Untitled",status:true,clientKey:`note:${note.id}`,date:todayISO(),data:{id:note.id,title:note.title,content:note.content,pinned:note.pinned,order:note.order,createdAt:note.createdAt,updatedAt:note.updatedAt}});
};
const enforceSinglePinnedNote=preferredId=>{
  const pinned=[...NOTES].filter(n=>!!n.pinned);
  if(pinned.length<=1)return;
  const keepId=(preferredId&&pinned.some(n=>n.id===preferredId))
    ?preferredId
    :pinned.sort((a,b)=>(b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""))[0].id;
  NOTES.forEach(n=>{n.pinned=n.id===keepId;});
};

// CLOUD SYNC ADAPTER
// ════════════════════════════════════════════
const todayISO=()=>new Date().toISOString().slice(0,10);
const weekKey=(d=new Date())=>{const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-dn);const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));const wn=Math.ceil((((dt-ys)/86400000)+1)/7);return`${dt.getUTCFullYear()}-W${String(wn).padStart(2,"0")}`;};
const normalizeCloudType=t=>{const n=String(t||"").trim().toLowerCase().replace(/[\s_-]+/g,"");if(!n)return"";if(n==="routinetask"||n==="routine")return"routineTask";if(n==="routinehistory"||n==="routinelog")return"routineHistory";if(n==="dailytask"||n==="todo"||n==="todotask")return"dailyTask";if(n==="weeklygoal"||n==="goal"||n==="maingoal")return"mainGoal";if(n==="note"||n==="notes")return"note";if(n==="focussession"||n==="focus"||n==="focustimer")return"focusSession";return n;}; // legacy "weeklygoal" is normalized to "mainGoal"
const inferCloudType=it=>{
  const direct=normalizeCloudType(it&&it.type);
  if(direct)return direct;
  const ck=String((it&&it.clientKey)||"").trim().toLowerCase();
  if(ck.startsWith("routine:"))return"routineTask";
  if(ck.startsWith("routinehist:"))return"routineHistory";
  if(ck.startsWith("daily:"))return"dailyTask";
  if(ck.startsWith("weekly:")||ck.startsWith("main:"))return"mainGoal";
  if(ck.startsWith("note:"))return"note";
  if(ck.startsWith("focus:"))return"focusSession";
  if(it&&it.week)return"mainGoal";
  if(it&&it.data&&((it.data.phase!=null)||(it.data.block!=null)||(it.data.kind==="definition")||(it.data.kind==="history")))return"routineTask";
  if(it&&it.date)return"dailyTask";
  return"";
};
// Build a stable deduplication key — type+name+date/week uniquely identifies each item
const mkClientKey=(type,name,date,week,routineId)=>{
  const norm=s=>(s||"").trim().toLowerCase().replace(/\s+/g,"_");
  if(type==="routineTask"){
    const rid=String(routineId||"").trim();
    if(!rid)console.warn("routineTask missing routineId - using name-based key which may create duplicate tasks if multiple tasks share the same name. Ensure task has a unique id.",name);
    return rid?`routine:${rid}`:`routine:${norm(name)}`;
  }
  if(type==="routineHistory"){
    const rid=String(routineId||"").trim()||norm(name)||"unknown";
    return`routinehist:${rid}:${date||todayISO()}`;
  }
  if(type==="dailyTask")return`daily:${date||todayISO()}:${norm(name)}`;
  if(type==="mainGoal"||type==="weeklyGoal"){
    const gid=String(routineId||"").trim();
    return gid?`weekly:${week||weekKey()}:${gid}`:`weekly:${week||weekKey()}:${norm(name)}`;
  }
  return`${type}:${norm(name)}`;
};
const CLOUD_PENDING_KEY="hdash-cloud-pending-v1";
const CLOUD_RETRY_BASE_MS=800;
const CLOUD_RETRY_MAX=5;
const cloudRetryTimers=new Map();
const cloudPending=new Map();
const cloudPendingKeyFor=payload=>{
  const key=String(payload&&payload.clientKey||"").trim().toLowerCase();
  if(key)return key;
  const name=String(payload&&payload.name||"").trim().toLowerCase();
  const date=String((payload&&payload.date)||(payload&&payload.week)||"").trim();
  const type=String(payload&&payload.type||"item").trim().toLowerCase();
  return`${type}:${name}:${date}`;
};
const loadCloudPending=()=>{
  try{
    const raw=localStorage.getItem(CLOUD_PENDING_KEY);
    const parsed=raw?JSON.parse(raw):[];
    if(!Array.isArray(parsed))return;
    parsed.forEach(entry=>{
      const key=cloudPendingKeyFor(entry&&entry.payload||{});
      if(!key||!entry||!entry.payload)return;
      cloudPending.set(key,{payload:entry.payload,attempts:entry.attempts||0,nextAt:entry.nextAt||0});
    });
  }catch(e){}
};
const persistCloudPending=()=>{
  try{
    const arr=[...cloudPending.values()].map(entry=>({payload:entry.payload,attempts:entry.attempts||0,nextAt:entry.nextAt||0}));
    localStorage.setItem(CLOUD_PENDING_KEY,JSON.stringify(arr));
  }catch(e){}
};
const shouldRetryCloud=(res,err)=>{
  if(err)return true;
  if(!res)return true;
  if(res.ok)return false;
  const code=Number(res.status||res.code||(res.error&&res.error.code)||0);
  if(code===429||code===408||code>=500)return true;
  const msg=String(res.error||"").toLowerCase();
  if(msg.includes("validation")||msg.includes("invalid")||msg.includes("permission")||msg.includes("auth"))return false;
  return true;
};
const retryDelayMs=attempts=>{
  const base=CLOUD_RETRY_BASE_MS*Math.pow(2,Math.max(0,attempts-1));
  const jitter=Math.floor(Math.random()*400);
  return Math.min(60000,base+jitter);
};
const scheduleCloudRetry=key=>{
  const entry=cloudPending.get(key);
  if(!entry)return;
  if(cloudRetryTimers.has(key))clearTimeout(cloudRetryTimers.get(key));
  const delay=Math.max(0,(entry.nextAt||0)-Date.now());
  const timer=setTimeout(()=>{
    cloudRetryTimers.delete(key);
    const pending=cloudPending.get(key);
    if(!pending)return;
    if(Date.now()<(pending.nextAt||0))return scheduleCloudRetry(key);
    Cloud.upsert(pending.payload,{fromRetry:true});
  },delay);
  cloudRetryTimers.set(key,timer);
};
const enqueueCloudRetry=(payload)=>{
  const key=cloudPendingKeyFor(payload);
  if(!key)return;
  const prev=cloudPending.get(key);
  const attempts=(prev?prev.attempts:0)+1;
  if(attempts>CLOUD_RETRY_MAX)return;
  const nextAt=Date.now()+retryDelayMs(attempts);
  cloudPending.set(key,{payload,attempts,nextAt});
  persistCloudPending();
  scheduleCloudRetry(key);
};
const clearCloudPending=payload=>{
  const key=cloudPendingKeyFor(payload);
  if(!key)return;
  cloudPending.delete(key);
  persistCloudPending();
  if(cloudRetryTimers.has(key)){
    clearTimeout(cloudRetryTimers.get(key));
    cloudRetryTimers.delete(key);
  }
};
const processCloudPending=()=>{
  const now=Date.now();
  cloudPending.forEach((entry,key)=>{
    if((entry.nextAt||0)<=now)Cloud.upsert(entry.payload,{fromRetry:true});
    else scheduleCloudRetry(key);
  });
};
const cloudUpsertQueueByClientKey=new Map();
const Cloud={
  enabled:false,user:null,items:[],
  byType(type){return this.items.filter(x=>inferCloudType(x)===type);},
  async refresh(){if(!window.fetchCloudData)return null;try{const res=await window.fetchCloudData();if(!res?.ok){console.warn("Cloud fetch failed",res?.error);return null;}this.items=(res.items||[]).map(it=>({...it,type:inferCloudType(it)}));processCloudPending();return this.items;}catch(e){console.warn("Cloud refresh error",e);return null;}},
  async upsert(item,{fromRetry=false}={}){
    if(!window.saveCloudItem)return null;
    const payload={...item,type:normalizeCloudType(item.type)};
    const run=async()=>{
      try{
        const res=await window.saveCloudItem(payload);
        if(!res?.ok)console.warn(`Cloud save failed [${payload.type}:${payload.name}]`,res?.error);
        return res||null;
      }catch(e){
        console.warn(`Cloud upsert error [${payload.type}:${payload.name}]`,e);
        return null;
      }
    };
    const key=String(payload.clientKey||"").trim().toLowerCase();
    if(!key)return run();
    const prev=cloudUpsertQueueByClientKey.get(key)||Promise.resolve();
    const next=prev.catch(err=>{
      console.warn(`Cloud upsert queue: proceeding after previous failure [${payload.type}:${payload.name}]`,err);
      return null;
    }).then(run);
    cloudUpsertQueueByClientKey.set(key,next);
    try{
      const res=await next;
      if(res&&res.ok){
        if(fromRetry)clearCloudPending(payload);
      }else if(shouldRetryCloud(res,null)){
        enqueueCloudRetry(payload);
      }
      return res;
    }finally{
      if(cloudUpsertQueueByClientKey.get(key)===next)cloudUpsertQueueByClientKey.delete(key);
    }
  }
};
loadCloudPending();

const calcDailyProgress=()=>{const k=todayKey();const pool=getTasksForDay(k);const dd=RDATA[k]||{};const rDone=pool.filter(t=>dd[t.id]).length;const tdDone=TODOS.filter(t=>t.done&&t.createdAt===k).length;const tdTotal=TODOS.filter(t=>t.createdAt===k).length;const total=pool.length+tdTotal||1;return Math.round(((rDone+tdDone)/total)*100);};
const calcTotalProgress=()=>{const k=todayKey();const pool=getTasksForDay(k);const dd=RDATA[k]||{};const rDone=pool.filter(t=>dd[t.id]).length;const tdDone=TODOS.filter(t=>t.done&&t.createdAt===k).length;const tdTotal=TODOS.filter(t=>t.createdAt===k).length;const wDone=GOALS.filter(g=>(g.progress||0)>=100).length;const total=pool.length+tdTotal+GOALS.length||1;return Math.round(((rDone+tdDone+wDone)/total)*100);};
const calcStreakFromGrid=(lastNDays=60)=>{let s=0;const d=new Date();for(let i=0;i<lastNDays;i++){if(pct(dKey(d))>=100){s++;d.setDate(d.getDate()-1);}else break;}return s;};

// Called by onAuthStateChanged after Cloud.refresh() — maps Notion items into local state arrays
window.loadCloudData=(items)=>{
  items=(items||[]).map(it=>({...it,type:inferCloudType(it)}));
  const today=todayKey();const wk=weekKey();
  const historyEarliestById=new Map();
  const recordHistorySeed=item=>{
    const day=normalizeDayKey(item&&item.date)||"";
    const taskId=getRoutineTaskIdFromCloudItem(item);
    if(day&&taskId){
      const prev=historyEarliestById.get(taskId);
      if(!prev||day<prev)historyEarliestById.set(taskId,day);
    }
    const snap=item&&item.data&&item.data.snapshot;
    if(day&&snap)upsertRoutineDaySnapshotTask(day,snap);
  };
  items.filter(x=>x.type==="routineHistory").forEach(recordHistorySeed);
  items.filter(x=>x.type==="routineTask"&&x.data&&x.data.kind==="history").forEach(recordHistorySeed);
  // routineTask → merge cloud definitions + cloud history safely with local state
  const cloudRoutine=items.filter(x=>x.type==="routineTask");
  let taskNameIndex=new Map();
  if(cloudRoutine.length){
    const mappedCloudRoutine=cloudRoutine
      .filter(ci=>ci&&ci.data&&((ci.data.kind==="definition")||(ci.data.phase!=null)||(ci.data.block!=null)))
      .map(ci=>{
      const id=getRoutineTaskIdFromCloudItem(ci);
      const createdAtRaw=normalizeDayKey(ci&&ci.data&&ci.data.createdAt);
      const historyAt=historyEarliestById.get(id)||"";
      const dateFallback=normalizeDayKey(ci&&ci.date);
      const createdAt=historyAt&&(!createdAtRaw||createdAtRaw>historyAt)?historyAt:(createdAtRaw||historyAt||dateFallback||today);
      return{
        id,name:ci.name,
        phase:(ci.data&&ci.data.phase)||"Morning",block:(ci.data&&ci.data.block)||"",
        ...(ci.data&&ci.data.order!=null?{order:ci.data.order}:{}),
        ...(ci.data&&Array.isArray(ci.data.subs)?{subs:ci.data.subs.map(s=>String(s||"").trim()).filter(Boolean)}:{}),
        ...(ci.data&&Array.isArray(ci.data.aliases)?{aliases:ci.data.aliases.map(s=>String(s||"").trim()).filter(Boolean)}:{}),
        ...(ci.data&&ci.data.schedule?{schedule:ci.data.schedule}:{}),
        ...(ci.data&&ci.data.updatedAt?{updatedAt:ci.data.updatedAt}:{}),
        createdAt,
        ...(ci.data&&ci.data.hibernatedAt?{hibernatedAt:ci.data.hibernatedAt}:{}),
        ...(ci.data&&ci.data.deletedAt?{deletedAt:ci.data.deletedAt}:{})
      };
    });
    const merged=new Map();
    const keyForTask=t=>{
      const id=String((t&&t.id)||"").trim();
      if(id)return`id:${id}`;
      const nameKey=routineTaskNameKey(t&&t.name);
      return nameKey?`name:${nameKey}`:"";
    };
    RTASKS.forEach(t=>{const k=keyForTask(t);if(k)merged.set(k,t);});
    mappedCloudRoutine.forEach(t=>{
      const k=keyForTask(t);
      if(!k)return;
      const prev=merged.get(k)||null;
      if(!prev){merged.set(k,t);return;}
      const prevTs=routineTaskUpdatedAt(prev);
      const nextTs=routineTaskUpdatedAt(t);
      const preferNext=nextTs>prevTs;
      merged.set(k,mergeRoutineTasks(prev,t,preferNext));
    });
    RTASKS=[...merged.values()];
    ensureRoutineTaskIntegrity();
    taskNameIndex=buildRoutineNameIndex(RTASKS);
    const applyRoutineHistoryItem=ci=>{
      const dateKey=normalizeDayKey(ci&&ci.date)||today;
      let taskId=getRoutineTaskIdFromCloudItem(ci);
      if(!taskId){
        const nameKey=routineTaskNameKey(ci&&ci.name);
        taskId=nameKey?taskNameIndex.get(nameKey)||"":"";
      }
      if(!taskId)return;
      if(!RDATA[dateKey])RDATA[dateKey]={};
      const status=!!ci.status;
      if(status)RDATA[dateKey][taskId]=true;
      else if(RDATA[dateKey][taskId]!==true)RDATA[dateKey][taskId]=false;
      const snap=ci&&ci.data&&ci.data.snapshot;
      if(snap)upsertRoutineDaySnapshotTask(dateKey,snap);
    };
    cloudRoutine.forEach(ci=>{
      const isDefinition=!!(ci&&ci.data&&((ci.data.kind==="definition")||(ci.data.phase!=null)||(ci.data.block!=null)));
      const isHistory=!!(ci&&ci.data&&ci.data.kind==="history");
      if(!isDefinition&&isHistory)applyRoutineHistoryItem(ci);
    });
  }
  if(!taskNameIndex.size)taskNameIndex=buildRoutineNameIndex(RTASKS);
  const cloudRoutineHistory=items.filter(x=>x.type==="routineHistory");
  cloudRoutineHistory.forEach(ci=>{
    const dateKey=normalizeDayKey(ci&&ci.date)||today;
    let taskId=getRoutineTaskIdFromCloudItem(ci);
    if(!taskId){
      const nameKey=routineTaskNameKey(ci&&ci.name);
      taskId=nameKey?taskNameIndex.get(nameKey)||"":"";
    }
    if(!taskId)return;
    if(!RDATA[dateKey])RDATA[dateKey]={};
    const status=!!ci.status;
    if(status)RDATA[dateKey][taskId]=true;
    else if(RDATA[dateKey][taskId]!==true)RDATA[dateKey][taskId]=false;
    const snap=ci&&ci.data&&ci.data.snapshot;
    if(snap)upsertRoutineDaySnapshotTask(dateKey,snap);
  });
  // dailyTask → authoritative cloud hydration (when signed in, empty cloud list clears stale local todos)
  const cloudDaily=items.filter(x=>x.type==="dailyTask");
  if(cloudDaily.length||Cloud.enabled){
    const merged=new Map();
    const keyForTodo=t=>{
      const id=String((t&&t.id)||"").trim();
      if(id)return`id:${id}`;
      const dt=String((t&&t.createdAt)||"").trim();
      const tx=String((t&&t.text)||"").trim().toLowerCase();
      return`daily:${dt}:${tx}`;
    };
    cloudDaily.forEach((ci,i)=>{
      const mapped={
        id:(ci.data&&ci.data.id)||ci.id,
        text:ci.name||"",
        done:!!ci.status,
        indent:(ci.data&&ci.data.indent!=null)?ci.data.indent:0,
        createdAt:ci.date||today,
        order:(ci.data&&ci.data.order!=null?ci.data.order:i),
        deleted:!!(ci.data&&ci.data.deleted)
      };
      const k=keyForTodo(mapped);
      const prev=merged.get(k)||null;
      const prevTs=prev?Date.parse(String(prev.createdAt||""))||0:0;
      const nextTs=Date.parse(String(mapped.createdAt||""))||0;
      if(!prev||nextTs>=prevTs)merged.set(k,mapped);
    });
    // Strip tombstone marker after filtering so local state shape remains unchanged.
    TODOS=[...merged.values()].filter(t=>!t.deleted).map(({deleted,...t})=>t);
  }
  // mainGoal → hydrate GOALS for current week from cloud (ignore tombstones)
  const normGoalName=s=>String(s||"").trim().toLowerCase();
  const mapCloudGoal=(ci,i)=>{
    const rawProgress=Number(ci&&ci.data&&ci.data.progress);
    return{
      id:(ci.data&&ci.data.id)||ci.id,
      name:ci.name,
      emoji:(ci.data&&ci.data.emoji)||"",
      desc:(ci.data&&ci.data.desc)||"",
      calendar:normalizeGoalCalendarRows((ci.data&&ci.data.calendar)||(ci.data&&ci.data.goalCalendar)||[]),
      color:(ci.data&&ci.data.color)||"default",
      progress:Math.max(0,Math.min(100,Number.isFinite(rawProgress)?rawProgress:0)),
      order:(ci.data&&Number.isFinite(Number(ci.data.order)))?Number(ci.data.order):i
    };
  };
  const itemWeek=x=>{
    const topLevelWeek=String((x&&x.week)||"").trim();
    if(topLevelWeek)return topLevelWeek;
    const dataWeek=String((x&&x.data&&x.data.week)||"").trim();
    if(dataWeek)return dataWeek;
    const date=String((x&&x.date)||"").trim();
    const dt=parseYMD(date);
    return dt?weekKey(dt):"";
  };
  const goalIdentityKeys=cloudItem=>{
    const keys=[];
    const goalId=String((cloudItem&&cloudItem.data&&cloudItem.data.id)||"").trim();
    if(goalId)keys.push(`id:${goalId}`);
    const clientKey=String((cloudItem&&cloudItem.clientKey)||"").trim().toLowerCase();
    if(clientKey)keys.push(`key:${clientKey}`);
    const nameKey=normGoalName((cloudItem&&cloudItem.name)||"");
    if(nameKey)keys.push(`name:${nameKey}`);
    if(!keys.length)keys.push(`item:${itemWeek(cloudItem)||wk}:${String((cloudItem&&cloudItem.id)||"").trim()}`);
    return keys;
  };
  const allWeeklyGoalItems=items.filter(x=>x.type==="mainGoal");
  const parseGoalWeek=week=>{
    const m=String(week||"").trim().match(/^(\d{4})-W(\d{2})$/i);
    if(!m)return null;
    const year=Number(m[1]),weekNo=Number(m[2]);
    if(!Number.isFinite(year)||!Number.isFinite(weekNo))return null;
    if(year<1970||year>9999)return null;
    if(weekNo<1||weekNo>53)return null;
    return{year,week:weekNo};
  };
  const parsedGoalWeeks=[...new Set(allWeeklyGoalItems.map(itemWeek).filter(Boolean))]
    .map(raw=>({raw,parsed:parseGoalWeek(raw)}))
    .filter(x=>!!x.parsed);
  const weeklyGoalWeeks=parsedGoalWeeks.map(x=>x.raw);
  parsedGoalWeeks.sort((a,b)=>{
    if(a.parsed.year!==b.parsed.year)return a.parsed.year-b.parsed.year;
    return a.parsed.week-b.parsed.week;
  });
  const latestGoalWeek=parsedGoalWeeks.length?parsedGoalWeeks[parsedGoalWeeks.length-1].raw:null;
  const targetGoalWeek=weeklyGoalWeeks.includes(wk)?wk:latestGoalWeek;
  let weeklyGoalItems=targetGoalWeek?allWeeklyGoalItems.filter(x=>itemWeek(x)===targetGoalWeek):[];
  if(targetGoalWeek===wk){
    let latestPriorWeek=null;
    for(let i=parsedGoalWeeks.length-1;i>=0;i--){
      const candidate=parsedGoalWeeks[i].raw;
      if(candidate!==wk){latestPriorWeek=candidate;break;}
    }
    if(latestPriorWeek){
      const targetWeekIdentity=new Set();
      weeklyGoalItems.forEach(item=>goalIdentityKeys(item).forEach(k=>targetWeekIdentity.add(k)));
      const inheritedGoals=allWeeklyGoalItems
        .filter(x=>itemWeek(x)===latestPriorWeek&&x.status!==false)
        .filter(x=>!goalIdentityKeys(x).some(k=>targetWeekIdentity.has(k)));
      weeklyGoalItems=[...weeklyGoalItems,...inheritedGoals];
    }
  }
  const hasWeekGoalRecords=weeklyGoalItems.length>0;
  const deletedGoalIds=new Set();
  weeklyGoalItems.filter(x=>x.status===false).forEach(x=>{
    goalIdentityKeys(x).forEach(k=>deletedGoalIds.add(k));
  });
  const cloudGoals=weeklyGoalItems.filter(x=>{
    if(x.status===false)return false;
    return !goalIdentityKeys(x).some(k=>deletedGoalIds.has(k));
  });
  if(hasWeekGoalRecords){
    const dedupedGoals=new Map();
    const goalDedupeKey = cloudItem=>{
      const keys=goalIdentityKeys(cloudItem);
      for(const key of keys){
        if(key.startsWith("id:"))return key;
      }
      for(const key of keys){
        if(key.startsWith("key:"))return key;
      }
      for(const key of keys){
        if(key.startsWith("name:"))return key;
      }
      return keys[0];
    };
    const shouldReplaceGoal = (prevItem, nextItem)=>{
      const prevTs=Date.parse(String((prevItem&&prevItem.date)||""))||0;
      const nextTs=Date.parse(String((nextItem&&nextItem.date)||""))||0;
      if(nextTs>prevTs)return true;
      if(nextTs<prevTs)return false;
      const prevOrder=(prevItem&&prevItem.data&&Number.isFinite(Number(prevItem.data.order)))?Number(prevItem.data.order):Number.MAX_SAFE_INTEGER;
      const nextOrder=(nextItem&&nextItem.data&&Number.isFinite(Number(nextItem.data.order)))?Number(nextItem.data.order):Number.MAX_SAFE_INTEGER;
      return nextOrder<=prevOrder;
    };
    cloudGoals.forEach((ci,i)=>{
      const key=goalDedupeKey(ci);
      const prev=dedupedGoals.get(key);
      if(!prev){dedupedGoals.set(key,{ci,i});return;}
      if(shouldReplaceGoal(prev.ci,ci))dedupedGoals.set(key,{ci,i});
    });
    const dedupedByName=new Map();
    [...dedupedGoals.values()].forEach(({ci,i})=>{
      const nameKey=normGoalName((ci&&ci.name)||"");
      const key=nameKey?`name:${nameKey}`:goalDedupeKey(ci);
      const prev=dedupedByName.get(key);
      if(!prev||shouldReplaceGoal(prev.ci,ci))dedupedByName.set(key,{ci,i});
    });
    if(dedupedByName.size){
      GOALS=[...dedupedByName.values()].map(({ci,i})=>mapCloudGoal(ci,i));
    }else{
      // Preserve existing local/account GOALS when week records exist but no active goals resolve.
    }
  }
  // note → merge cloud notes into NOTES (skip tombstoned items with status:false)
  const cloudNotes=items.filter(x=>x.type==="note"&&x.status!==false);
  if(cloudNotes.length){
    const merged=new Map();
    NOTES.forEach(n=>{merged.set(n.id,n);});
    cloudNotes.forEach(ci=>{
      const d=ci.data||{};
      const mapped={id:d.id||ci.id,title:d.title||ci.name||"Untitled",content:d.content||"",pinned:!!d.pinned,order:d.order!=null?d.order:0,createdAt:d.createdAt||ci.date||today,updatedAt:d.updatedAt||ci.date||today};
      if(mapped.id){const prev=merged.get(mapped.id)||{};merged.set(mapped.id,{...prev,...mapped});}
    });
    NOTES=[...merged.values()].sort((a,b)=>(a.order||0)-(b.order||0));
  }
  // focusSession → merge cloud sessions into FOCUS.sessions
  const cloudFocus=items.filter(x=>x.type==="focusSession");
  if(cloudFocus.length){
    const merged=new Map();
    (FOCUS.sessions||[]).forEach(s=>{merged.set(s.id,s);});
    cloudFocus.forEach(ci=>{
      const d=ci.data||{};
      const mapped={id:d.id||ci.id,date:d.date||ci.date||today,duration:d.duration||1,note:d.note||"",cycles:d.cycles||1,createdAt:d.createdAt||ci.date||today};
      if(mapped.id){const prev=merged.get(mapped.id)||{};merged.set(mapped.id,{...prev,...mapped});}
    });
    FOCUS.sessions=[...merged.values()];
  }
  normalizeGoals();
  ensureRoutineTaskIntegrity();
  primeRoutineHistory({persist:false});
  localSave();
  routineSnapshotDirty=false;
  window.renderAll();
};

// Show/hide the "Import local tasks to cloud" button
window.updateImportUI=()=>{
  const btn=document.getElementById("cloud-import-btn");
  const st=document.getElementById("cloud-import-status");
  if(!btn)return;
  const C=window.Cloud;
  const hasLocal=RTASKS.length>0;
  const keyForTask=t=>{
    const id=String((t&&t.id)||"").trim();
    return id?`id:${id}`:`name:${String((t&&t.name)||"").trim().toLowerCase()}`;
  };
  const getRoutineImportSource=()=>{
    const merged=new Map();
    RTASKS.forEach(t=>{merged.set(keyForTask(t),t);});
    return [...merged.values()];
  };
  const routineImportSource=getRoutineImportSource();
  const cloudRoutine=((C&&C.byType("routineTask"))||[]).filter(ci=>ci&&ci.data&&((ci.data.kind==="definition")||(ci.data.phase!=null)||(ci.data.block!=null)));
  const cloudKeys=new Set();
  cloudRoutine.forEach(ci=>{
    const cid=String((ci&&ci.data&&ci.data.id)||"").trim();
    const ckey=String((ci&&ci.clientKey)||"").trim();
    const cname=String((ci&&ci.name)||"").trim().toLowerCase();
    if(cid)cloudKeys.add(`id:${cid}`);
    if(ckey)cloudKeys.add(`key:${ckey}`);
    if(cname)cloudKeys.add(`name:${cname}`);
  });
  const hasLocalNotInCloud=routineImportSource.some(t=>{
    const id=String((t&&t.id)||"").trim();
    const name=String((t&&t.name)||"").trim().toLowerCase();
    const idKey=id?`key:routine:${id}`:"";
    const legacyKey=name?`key:routine:${name.replace(/\s+/g,"_")}`:"";
    return !cloudKeys.has(`id:${id}`)&&(!idKey||!cloudKeys.has(idKey))&&(!legacyKey||!cloudKeys.has(legacyKey))&&(!name||!cloudKeys.has(`name:${name}`));
  });
  btn.style.display=(C&&C.enabled&&hasLocal&&hasLocalNotInCloud)?"":"none";
  if(st)st.style.display="none";
};

// One-time idempotent migration: push all local tasks to cloud
// Each item is attempted independently — a failure on one item does not abort others
window.importLocalToCloud=async()=>{
  const C=window.Cloud;
  if(!C||!C.enabled){showToast("Sign in first");return;}
  ensureRoutineTaskIntegrity();
  const btn=document.getElementById("cloud-import-btn");
  const st=document.getElementById("cloud-import-status");
  if(btn){btn.disabled=true;btn.textContent="Importing...";}
  if(st){st.style.display="";st.textContent="Uploading...";}
  const today=todayKey();const wk=weekKey();
  const keyForTask=t=>{
    const id=String((t&&t.id)||"").trim();
    return id?`id:${id}`:`name:${String((t&&t.name)||"").trim().toLowerCase()}`;
  };
  const routineImportSource=(()=>{
    const merged=new Map();
    RTASKS.forEach(t=>{merged.set(keyForTask(t),t);});
    return [...merged.values()];
  })();
  const routineOrdered=[...routineImportSource].sort(compareRoutineTasks);
  const historyRows=[];
  Object.entries(RDATA||{}).forEach(([dateKey,row])=>{
    if(!row||typeof row!=="object")return;
    Object.entries(row).forEach(([taskId,isDone])=>{
      if(!isDone)return;
      const task=RTASKS.find(t=>String(t.id)===String(taskId));
      if(!task)return;
      historyRows.push({dateKey,taskId:task.id,name:task.name});
    });
  });
  const totalItems=routineOrdered.length+TODOS.length+GOALS.length+historyRows.length;
  let succeeded=0,failed=0;
  // Import routine tasks
  for(let i=0;i<routineOrdered.length;i++){
    const t=routineOrdered[i];
    try{
      const res=await C.upsert({type:"routineTask",name:routineTaskCloudName(t),status:false,clientKey:mkClientKey("routineTask",routineTaskCloudName(t),null,null,t.id),data:{kind:"definition",id:t.id,phase:t.phase,block:t.block||"",active:!t.hibernatedAt&&!t.deletedAt,order:i,createdAt:normalizeDayKey(t.createdAt)||today,...(t.updatedAt?{updatedAt:String(t.updatedAt)}:{}),...(t.aliases&&t.aliases.length?{aliases:normalizeRoutineAliases(t.aliases)}:{}),...(t.schedule?{schedule:normalizeRoutineSchedule(t.schedule)}:{}),...(t.subs&&t.subs.length?{subs:t.subs.map(s=>String(s||"").trim()).filter(Boolean)}:{}),...(t.hibernatedAt?{hibernatedAt:t.hibernatedAt}:{}),...(t.deletedAt?{deletedAt:t.deletedAt}:{})}});
      if(res?.ok!==true)failed++;else succeeded++;
    }catch(e){console.warn("import routineTask failed:",t.name,e);failed++;}
    if(st)st.textContent=`Uploading... ${succeeded+failed}/${totalItems}`;
  }
  // Import routine completion history (preserves adherence across devices)
  for(const h of historyRows){
    try{
      const res=await C.upsert({type:"routineHistory",name:String(h.name||"").trim()||"Routine task",status:true,date:h.dateKey,clientKey:mkClientKey("routineHistory",h.name,h.dateKey,null,h.taskId),data:{kind:"history",id:h.taskId,snapshot:routineTaskSnapshot(RTASKS.find(t=>t.id===h.taskId)||{id:h.taskId,name:h.name,phase:"Morning",block:"",order:Number.MAX_SAFE_INTEGER})}});
      if(res?.ok!==true)failed++;else succeeded++;
    }catch(e){console.warn("import routineHistory failed:",h.taskId,e);failed++;}
    if(st)st.textContent=`Uploading... ${succeeded+failed}/${totalItems}`;
  }
  // Import daily todos
  for(const t of TODOS){
    try{
      const res=await C.upsert({type:"dailyTask",name:t.text,status:!!t.done,date:t.createdAt||today,clientKey:mkClientKey("dailyTask",t.text,t.createdAt||today),data:{id:t.id,order:t.order||0,indent:t.indent||0,deleted:false}});
      if(res?.ok!==true)failed++;else succeeded++;
    }catch(e){console.warn("import dailyTask failed:",t.text,e);failed++;}
    if(st)st.textContent=`Uploading... ${succeeded+failed}/${totalItems}`;
  }
  // Import main goals
  for(const g of GOALS){
    try{
      const res=await C.upsert({type:"mainGoal",name:g.name,status:true,week:wk,clientKey:mkClientKey("mainGoal",g.name,null,wk,g.id),data:{id:g.id,emoji:g.emoji||"",desc:g.desc||"",calendar:normalizeGoalCalendarRows(g.calendar||[]),color:g.color||"default",progress:g.progress||0,order:g.order||0}});
      if(res?.ok!==true)failed++;else succeeded++;
    }catch(e){console.warn("import mainGoal failed:",g.name,e);failed++;}
    if(st)st.textContent=`Uploading... ${succeeded+failed}/${totalItems}`;
  }
  const total=totalItems;
  if(failed===0){
    showToast("Imported "+succeeded+" items to cloud");
    if(st)st.textContent="Imported "+succeeded+" items ✓";
  }else{
    showToast(`Imported ${succeeded} of ${total} items (${failed} failed)`);
    if(st)st.textContent=`Imported ${succeeded}/${total} (${failed} failed)`;
  }
  if(btn){btn.disabled=false;btn.textContent="⬆ Import local tasks to cloud";}
  await C.refresh();
  if(window.loadCloudData)window.loadCloudData(C.items);
  window.updateImportUI();
};

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHRvAZajJ9CcdTMBcbGynfz0IRgZ9R-qM",
    authDomain: "routine-dashboard-7cbb5.firebaseapp.com",
    projectId: "routine-dashboard-7cbb5",
    storageBucket: "routine-dashboard-7cbb5.firebasestorage.app",
    messagingSenderId: "316859562150",
    appId: "1:316859562150:web:52a1980a15e6dbdb649c67"
  };

  const WORKER_BASE = "https://routine-notion-api.haardik49.workers.dev";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.loginWithGoogle = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error("Google sign-in failed:", e);
      alert(`Sign-in failed: ${e.code || ""} ${e.message || e}`);
    }
  };

  window.logoutUser = async () => {
    await signOut(auth);
  };

  window.fetchCloudData = async () => {
    const user = auth.currentUser;
    if (!user) return null;
    const token = await user.getIdToken();
    const res = await fetch(`${WORKER_BASE}/get`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    return res.json();
  };

  window.saveCloudItem = async (item) => {
    const user = auth.currentUser;
    if (!user) throw new Error("Not logged in");
    const token = await user.getIdToken();
    const res = await fetch(`${WORKER_BASE}/upsert`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify(item)
    });
    return res.json();
  };

  onAuthStateChanged(auth, async (user) => {
    const statusEl = document.getElementById("authStatus");
    if (statusEl) {
      statusEl.textContent = user ? `Signed in: ${user.email}` : "Guest mode (local only)";
    }

    if (user) {
      const C = window.Cloud;
      if (!C) return;
      C.enabled = true;
      C.user = user;
      if(window.showUserLocalState)window.showUserLocalState(user.uid);
      try {
        await C.refresh();
        if (window.loadCloudData) window.loadCloudData(C.items);
        if(window.saveLocalState&&window.storageKeysForUser)window.saveLocalState(window.storageKeysForUser(user.uid));
        const btn = document.getElementById("clear-local-btn");
        if(btn)btn.disabled=true;
        const menuBtn = document.getElementById("clear-local-btn-menu");
        if(menuBtn)menuBtn.disabled=true;
        if (window.updateImportUI) window.updateImportUI();
      } catch (e) {
        console.warn("Cloud sync error:", e);
      }
    } else {
      if (window.Cloud) {
        window.Cloud.enabled = false;
        window.Cloud.user = null;
        window.Cloud.items = [];
      }
      const btn = document.getElementById("cloud-import-btn");
      if (btn) { btn.style.display = "none"; btn.disabled = false; btn.textContent = "⬆ Import local tasks to cloud"; }
      const st = document.getElementById("cloud-import-status");
      if (st) st.style.display = "none";
      const clearLocalBtn = document.getElementById("clear-local-btn");
      if(clearLocalBtn)clearLocalBtn.disabled=false;
      const clearLocalBtnMenu = document.getElementById("clear-local-btn-menu");
      if(clearLocalBtnMenu)clearLocalBtnMenu.disabled=false;
      if(window.showGuestLocalState)window.showGuestLocalState();
    }
  });

</script>
